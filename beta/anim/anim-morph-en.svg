x="4" fill="#c63ac6" stroke="#111"/><text x="111" y="189.5" class="bt" fill="#111">Synth 1</text><g class="g0"><rect x="22" y="172" width="54" height="28" rx="4" fill="#c63ac6" stroke="#111"/><text x="49" y="189.5" class="bt" fill="#111">Preset</text></g><g class="g4"><circle cx="146" cy="96" r="21" fill="none" stroke="#ffff19" stroke-width="4"/><text x="146" y="130" class="kl">Position</text></g><g class="g2"><text x="194" y="20" class="kl">Square</text><text x="242" y="130" class="kl">LFO rate</text><text x="290" y="20" class="kl">Random</text><text x="386" y="20" class="kl">Length</text><text x="434" y="130" class="kl">Env</text><text x="482" y="20" class="kl">Time</text></g><g class="g5"><text x="338" y="130" class="kl">Slow →</text></g><g class="g6"><circle cx="338" cy="96" r="21" fill="none" stroke="#00ff00" stroke-width="4"/><text x="338" y="130" class="kl">Slow →</text></g><g class="g7"><circle cx="146" cy="96" r="21" fill="none" stroke="#00ff00" stroke-width="4"/><text x="146" y="130" class="kl">Position</text></g><g class="g0"><text x="580" y="44" class="vw">Synth 1 Preset</text></g><g class="g2"><text x="580" y="44" class="vw">Morph</text></g><g class="g8"><circle cx="187" cy="257" r="9" class="fg"/><circle cx="373" cy="257" r="9" class="fg"/><circle cx="249" cy="319" r="9" class="fg"/></g><g class="g5"><path d="M121.8 82A28 28 0 0 1 170.2 82" class="ta"/><path d="M173.7 88.1L166.4 84.2L174.1 79.8z" fill="#ff6a13"/></g><g class="g9"><path d="M313.8 82A28 28 0 0 1 362.2 82" class="ta"/><path d="M365.7 88.1L358.4 84.2L366.1 79.8z" fill="#ff6a13"/></g><g class="g3"><circle cx="125" cy="257" r="9" class="fg"/></g><g class="g10"><circle cx="559" cy="443" r="9" class="fg"/></g><g class="g11"><rect x="19" y="169" width="60" height="34" rx="6" class="fo"/><circle cx="76" cy="200" r="5" class="fg"/></g><rect x="12" y="474" width="632" height="102" rx="10" fill="#222428" stroke="#3a3d42"/><text x="24" y="495" class="ti">Morph between patches · Alpha 7.37 only</text><g class="g8"><circle cx="40" cy="522" r="17" fill="#ff6a13"/><text x="40" y="526.5" class="sn">1/6</text><text x="68" y="518" class="cp">Synth 1's Preset view: hold two to four patches (here pads 2, 5 and 11) for 0.4 s …</text></g><g class="g5"><circle cx="40" cy="522" r="17" fill="#ff6a13"/><text x="40" y="526.5" class="sn">2/6</text><text x="68" y="518" class="cp">… the morph view opens: K1 = the position along the chain, coloured by patch (1 red,</text><text x="68" y="535" class="cp">2 yellow, 3 green, 4 blue); K2 square LFO, K3 the LFOs' rate, K4 random-step LFO.</text></g><g class="g9"><circle cx="40" cy="522" r="17" fill="#ff6a13"/><text x="40" y="526.5" class="sn">3/6</text><text x="68" y="518" class="cp">K5 = the slow morph's destination, K6 its length (at once … 32 bars): turn K5 and</text><text x="68" y="535" class="cp">leave it for half a second: the sound moves from K1 to K5, and once there K1 takes</text><text x="68" y="552" class="cp">K5's value.</text></g><g class="g3"><circle cx="40" cy="522" r="17" fill="#ff6a13"/><text x="40" y="526.5" class="sn">4/6</text><text x="68" y="518" class="cp">K7 / K8 = the envelope (depth / time); pads 1 / 8 fire it, held while you hold them</text><text x="68" y="535" class="cp">(bright while it runs). Clear + knob = 0; Clear + the track button = every knob to</text><text x="68" y="552" class="cp">0.</text></g><g class="g10"><circle cx="40" cy="522" r="17" fill="#ff6a13"/><text x="40" y="526.5" class="sn">5/6</text><text x="68" y="518" class="cp">Pad 32 (red) = out. The morph goes on in the other views; the track button brings</text><text x="68" y="535" class="cp">its view back. One morph at a time; nothing is saved.</text></g><g class="g11"><circle cx="40" cy="522" r="17" fill="#ff6a13"/><text x="40" y="526.5" class="sn">6/6</text><text x="68" y="518" class="cp">Preset = the patches, those of the chain in white: a tap loads that patch and</text><text x="68" y="535" class="cp">leaves; holding patches 0.4 s = a new chain.</text></g></svg>
