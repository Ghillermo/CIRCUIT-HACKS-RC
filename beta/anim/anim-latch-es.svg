">2</text><text x="212" y="266" class="pn">3</text><text x="274" y="266" class="pn">4</text><text x="336" y="266" class="pn">5</text><text x="398" y="266" class="pn">6</text><text x="460" y="266" class="pn">7</text><text x="522" y="266" class="pn">8</text><text x="88" y="328" class="pn">9</text><text x="150" y="328" class="pn">10</text><text x="212" y="328" class="pn">11</text><text x="274" y="328" class="pn">12</text><text x="336" y="328" class="pn">13</text><text x="398" y="328" class="pn">14</text><text x="460" y="328" class="pn">15</text><text x="522" y="328" class="pn">16</text><text x="88" y="390" class="pn">17</text><text x="150" y="390" class="pn">18</text><text x="212" y="390" class="pn">19</text><text x="274" y="390" class="pn">20</text><text x="336" y="390" class="pn">21</text><text x="398" y="390" class="pn">22</text><text x="460" y="390" class="pn">23</text><text x="522" y="390" class="pn">24</text><text x="88" y="452" class="pn">25</text><text x="150" y="452" class="pn">26</text><text x="212" y="452" class="pn">27</text><text x="274" y="452" class="pn">28</text><text x="336" y="452" class="pn">29</text><text x="398" y="452" class="pn">30</text><text x="460" y="452" class="pn">31</text><text x="522" y="452" class="pn">32</text><rect x="84" y="172" width="54" height="28" rx="4" fill="#c63ac6" stroke="#111"/><text x="111" y="189.5" class="bt" fill="#111">Synth 1</text><rect x="22" y="224" width="54" height="38" rx="4" fill="#c63ac6" stroke="#111"/><text x="49" y="246.5" class="bt" fill="#111">Note</text><text x="580" y="44" class="vw">Note</text><g class="g0"><rect x="559" y="137" width="66" height="24" rx="6" class="fo"/><circle cx="622" cy="158" r="5" class="fg"/></g><g class="g6"><circle cx="249" cy="443" r="9" class="fg"/></g><g class="g7"><circle cx="373" cy="443" r="9" class="fg"/></g><g class="g8"><circle cx="373" cy="257" r="9" class="fg"/></g><rect x="12" y="474" width="632" height="102" rx="10" fill="#222428" stroke="#3a3d42"/><text x="24" y="495" class="ti">Fijar notas (latch) y escribirlas en un paso · desde RC4</text><g class="g1"><circle cx="40" cy="522" r="17" fill="#ff6a13"/><text x="40" y="526.5" class="sn">1/5</text><text x="68" y="518" class="cp">La vista Note de Synth 1. Mantén Shift y pulsa una tecla (pad 27): la nota suena y</text><text x="68" y="535" class="cp">sigue sonando al soltarla (un latch).</text></g><g class="g7"><circle cx="40" cy="522" r="17" fill="#ff6a13"/><text x="40" y="526.5" class="sn">2/5</text><text x="68" y="518" class="cp">Shift + otra tecla (pad 29): también fijada. Con Shift mantenido, las teclas fijadas</text><text x="68" y="535" class="cp">se ven verde azulado brillante y, con notas fijadas, los pads de paso en amarillo.</text></g><g class="g3"><circle cx="40" cy="522" r="17" fill="#ff6a13"/><text x="40" y="526.5" class="sn">3/5</text><text x="68" y="518" class="cp">Suelta Shift: las dos notas siguen sonando (la nota que suena se ve blanca). Con el</text><text x="68" y="535" class="cp">arpegiador encendido, las notas fijadas se arpegian.</text></g><g class="g8"><circle cx="40" cy="522" r="17" fill="#ff6a13"/><text x="40" y="526.5" class="sn">4/5</text><text x="68" y="518" class="cp">Shift + un paso (pad 5): las notas fijadas se escriben en ese paso (hasta 6, un paso</text><text x="68" y="535" class="cp">de largo, velocity 100). Solo Alpha 7.04: los pasos no cambian de color y el que se</text><text x="68" y="552" class="cp">escribe se ve verde azulado mientras lo mantienes.</text></g><g class="g5"><circle cx="40" cy="522" r="17" fill="#ff6a13"/><text x="40" y="526.5" class="sn">5/5</text><text x="68" y="518" class="cp">Pulsa otra vez una tecla fijada (pad 27): se para, y esa pulsación no hace nada más.</text><text x="68" y="535" class="cp">Clear + Synth 1 suelta todas las notas fijadas. No se guarda.</text></g></svg>
