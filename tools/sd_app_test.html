<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>sd_app tests</title>
<style>body { background:#111317; color:#e8e9ec; font:13px/1.45 ui-monospace,Consolas,monospace; padding:12px; } .bad { color:#ff7b72; } .ok { color:#7ee787; }</style>
</head>
<body>
<pre id="out"></pre>
<script>
/* The data layer of sd_app.html on the browser's own file system (OPFS: the same handles a real folder gives, without the folder dialog), over a card of
real files, and its result compared file by file with what tools/sd_app_fixture.py did on its own.  Run: python tools/sd_app_fixture.py, then open
http://127.0.0.1:8765/tools/sd_app_test.html (preview "repo-http"); window.RESULT = {pass, fail, lines}. */
const out = document.getElementById("out"), lines = [];
let pass = 0, fail = 0;
function check(ok, text) { ok ? pass++ : fail++; lines.push((ok ? "ok   " : "FAIL ") + text); const s = document.createElement("span"); s.className = ok ? "ok" : "bad"; s.textContent = (ok ? "ok   " : "FAIL ") + text + "\n"; out.append(s); }
const hex = b => [...b].map(x => x.toString(16).padStart(2, "0")).join("");
const eq = (a, b) => a.length === b.length && a.every((x, i) => x === b[i]);
const sha = async b => hex(new Uint8Array(await crypto.subtle.digest("SHA-256", b)));
async function walk(dir, pre = "", o = {}) {
  for await (const [n, h] of dir.entries()) {
    if (h.kind === "directory") await walk(h, pre + n + "/", o);
    else o[pre + n] = new Uint8Array(await (await h.getFile()).arrayBuffer());
  }
  return o;
}
function bridge() {                                        // ?device=1 (served by tools/sd_bridge.py): the same steps, on the firmware's protocol handlers instead of a folder
  let chain = Promise.resolve();
  const tx = {slow: 40, onmessage: null, sent: [], send(b) {
    const h = hex(b); tx.sent.push(h.slice(0, 18));
    chain = chain.then(async () => { for (const m of await (await fetch("/sysex", {method: "POST", body: h})).json()) tx.onmessage(Uint8Array.from(m.match(/../g), x => parseInt(x, 16))); });
  }};
  return tx;
}
const useList = u => { const o = new Set(); for (const k of ["nova", "drums", "custom"]) for (const [n, l] of u[k]) for (const x of l) o.add(`${k} ${n} ${x.sess} ${x.track} ${x.flip ? 1 : 0}`); return [...o].sort(); };
async function main() {
  const html = await (await fetch("sd_app.html", {cache: "no-store"})).text();
  (0, eval)(/<script id="core">([\s\S]*?)<\/script>/.exec(html)[1]);
  const SD = window.SD, E = await (await fetch("../build/sdapp_fixture/expected.json", {cache: "no-store"})).json();
  const DEV = new URLSearchParams(location.search).get("device");
  const opfs = await navigator.storage.getDirectory();
  try { await opfs.removeEntry("sdtest", {recursive: true}); } catch (_) { /* first run */ }
  const top = await opfs.getDirectoryHandle("sdtest", {create: true}), folder = await top.getDirectoryHandle("card", {create: true}), tracks = await folder.getDirectoryHandle("Tracks", {create: true});
  const bak = await top.getDirectoryHandle("backups", {create: true});
  let card = folder, dev = null, tx = null;
  if (DEV) {
    await fetch("/reset", {method: "POST"});
    tx = bridge(); dev = new SD.Device(tx);
    await dev.identify();
    check(dev.loaded === 0, `the inquiry answers; the loaded pack: ${dev.loaded}`);
    check(dev.fw === null, `the stock image answers no firmware query (tools/fwid.py): fw = ${dev.fw}`);
    check(await dev.open() === "opened" && dev.sess, "session open: the probe got no reply, so 40 was sent");
    const second = new SD.Device(tx);
    check(await second.open() === "adopted", "a page that comes back finds the session open and does not send 40 again");
    tx.onmessage = m => dev.rx(m);
    card = new SD.DevRoot(dev);
  }
  for (const path of DEV ? [] : E.start) {
    const parts = path.split("/"), name = parts.pop(); let d = tracks;
    for (const p of parts) d = await d.getDirectoryHandle(p, {create: true});
    const r = await fetch("../build/sdapp_fixture/card/Tracks/" + path.split("/").map(encodeURIComponent).join("/"), {cache: "no-store"});
    if (!r.ok) throw new Error("fixture: " + path);
    await SD.writeFile(d, name, new Uint8Array(await r.arrayBuffer()));
  }
  const originals = DEV ? {} : await walk(tracks);
  if (DEV) for (const path of E.start) if (!/\.bak$|SC34D/.test(path)) originals[path] = new Uint8Array(await (await fetch("../build/sdapp_fixture/card/Tracks/" + path.split("/").map(encodeURIComponent).join("/"))).arrayBuffer());

  // ---- the card
  const c = await SD.Card.open(card);
  check(c.packs.length === 2 && c.packs[0].slot === 0 && c.packs[1].slot === 3, `card root -> Tracks: ${c.packs.map(p => p.folder)}`);
  let threw = null;
  if (!DEV) {
    const c2 = await SD.Card.open(tracks);
    check(c2.packs.length === 2, "the Tracks folder itself opens too");
    try { await SD.Card.open(await top.getDirectoryHandle("backups")); } catch (e) { threw = e.message; }
    check(threw === "no-packs", "a folder without packs is refused");
  }
  const A = c.pack(0), B = c.pack(3), pa = {pack: A}, pb = {pack: B}, ctx = {backup: new SD.Backup(bak)};
  check(A.name === "Alpha" && B.folder === E.beta, "names and folders");
  check(SD.folderName(7, "x".repeat(40)).length === 30 && SD.folderName(7, "abcdefghijklmnopqrstuvwxy z  ") === "07_abcdefghijklmnopqrstuvwxy z", "a folder name is cut at 30, without a trailing space");
  const au = await SD.audit(B);
  if (!DEV) check(au.length === 2 && au.some(i => i.file === "Patches/00_PATCHBANK.cpb.bak") && au.some(i => i.file === "Sessions/05_SC34D.bin") && !(await SD.audit(A)).length, `the audit reports the stray NN_ files: ${au.map(i => i.file)}`);

  // ---- names, against patchtool
  for (const [p, key] of [[pa, E.alpha], [pb, E.beta]]) {
    const nv = await SD.Nova.list(p), cu = await SD.Custom.list(p), dr = await SD.Drums.list(p);
    check(nv.every((x, i) => x.name === E.names.nova[key][i]), `Nova names of ${key}: ${nv.filter(x => !x.empty).length} patches, as patchtool reads them`);
    check(cu.every((x, i) => (x.bad ? "bad" : x.empty ? "empty" : "ok") === E.names.custom[key][i].state && x.name === E.names.custom[key][i].name), `custom patches of ${key}: ${cu.filter(x => !x.empty).length}, as patchtool reads them`);
    check(dr.filter(x => !x.empty).every(x => E.names.drums[key][SD.pad2(x.slot)] === x.name) && dr.filter(x => !x.empty).length === Object.keys(E.names.drums[key]).length, `sample names of ${key}`);
    check(await SD.Drums.words(p) === E.words[key], `sample memory of ${key}: ${E.words[key]} words`);
  }
  for (const [p, key] of [[pa, E.alpha], [pb, E.beta]]) {
    const u = useList(await SD.usageOf(p.pack)), want = E.usage[key];
    check(u.join("|") === want.join("|"), `what the projects of ${key} use: ${u.length} uses, as the fixture reads them` + (u.join("|") === want.join("|") ? "" : ` (got ${u.filter(x => !want.includes(x))}, missing ${want.filter(x => !u.includes(x))})`));
  }
  const ua = await SD.usageOf(A);
  check((ua.custom.get(10) || []).some(x => x.sess === 1 && x.track === 3) && !ua.custom.get(12) && (ua.drums.get(2) || []).some(x => x.sess === 1 && x.track === 2 && !x.flip) && (ua.drums.get(5) || []).some(x => x.sess === 1 && x.track === 2 && x.flip),
        "Alpha: custom 10 = MIDI 2's sound of session 01 (another name), sample 2 = MIDI 1's sample engine, sample 5 = its flip");
  const wi = SD.wavInfo((await SD.Drums.get(pa, 0)).bytes);
  check(wi && wi.format === 1 && wi.rate === 48000 && wi.bits === 16 && wi.channels >= 1, `a sample's format: ${JSON.stringify(wi)}`);

  // ---- Nova
  await SD.transfer(SD.Nova, pa, [3], pb, [20], {}, ctx);
  await SD.transfer(SD.Nova, pa, [5], pa, [100], {move: true}, ctx);
  await SD.Nova.clear(pb, 1, ctx);
  check((await SD.Nova.get(pa, 5)) === null && (await SD.Nova.get(pa, 100)) !== null, "Nova: moved, the source slot empty");

  // ---- custom patches
  await SD.transfer(SD.Custom, pa, [10], pb, [11], {}, ctx);
  await SD.transfer(SD.Custom, pa, [12], pb, [70], {move: true}, ctx);
  const pad = await SD.Custom.get(pb, 11);
  check(SD.ctmName(pad) === "BASS" && SD.ctmState(pad) === "ok" && SD.ctmCode(pad, 1) === -20 && SD.ctmCode(pad, 10) === 33, "custom: copied with its values");
  const fm = SD.fmGet(pad);
  check(fm && fm.ver === 2 && fm.on === 1 && fm.params[0] === 100 && SD.vmGet(pad).mode === 3, "custom: the FM block and the voice mode travel with it");
  SD.ctmSetCode(pad, 1, -10); SD.ctmSetCode(pad, 2, 77); SD.ctmSetName(pad, "EDITED");
  fm.on = 0; fm.params[12] = 9; SD.fmSet(pad, fm);
  SD.vmSet(pad, {mode: 3, time: 10, detune: 20});
  await SD.Custom.put(pb, 11, pad, ctx);
  const nw = SD.ctmNew();
  check(SD.ctmState(nw) === "ok" && SD.ctmCode(nw, 7) === 127 && SD.ctmCode(nw, 20) === 50 && nw[41] === 2 && nw[42] === 2, "a new patch: the initial values, the triangle");

  // ---- drums
  await SD.transfer(SD.Drums, pa, [2], pb, [40], {}, ctx);
  await SD.transfer(SD.Drums, pa, [1], pb, [0], {}, ctx);
  await SD.Drums.clear(pa, 3, ctx);
  await SD.transfer(SD.Drums, pa, [4], pa, [50], {move: true}, ctx);
  const dra = await SD.Drums.list(pa);
  check(dra[3].empty && dra[4].empty && !dra[50].empty, "drums: deleted and moved");

  // ---- patterns
  const sa = {pack: A, sess: 0}, sb = {pack: B, sess: 0}, off = SD.patOff;
  const M = 16, li = await SD.Patterns.list(sa), full = li.filter(x => x.notes && x.slot >> 4 === 1).map(x => x.slot);      // MIDI 1 = slots 16..23 of the eight tracks
  check(full.map(n => n - M).join() === E.full.join(), `MIDI patterns with notes: ${full}`);
  let same = true;
  for (let n = 0; n < 32; n++) { const b = await SD.Patterns.get(sa, n); if (!eq(SD.patBuild(SD.patParse(b), b), b)) same = false; }
  check(same, "a note pattern parsed and built again = the same 3 240 bytes (32 patterns: Synth 1 / 2, MIDI 1 / 2)");
  check(li.length === 64 && SD.patOff(0) === 0x2E4 && SD.patOff(16) === SD.MIDI0 && SD.patOff(32) === SD.DRUM0 && SD.patOff(63) + SD.DPAT === 0x1A274, "the eight tracks: 64 patterns, end of the drums at 0x1A274");
  const hitz = li.filter(x => x.slot >= 32 && x.notes);
  if (hitz.length) {
    const d0 = hitz[0], db = await SD.Patterns.get(sa, d0.slot);
    check(db.length === SD.DPAT && d0.cells.every(u => u.vel === (db[u.s] & 127)), `drum pattern ${d0.slot}: ${d0.notes} hits`);
    const mid = SD.patMidi(db, d0.slot, 9);
    check(String.fromCharCode(...mid.subarray(0, 4)) === "MThd" && String.fromCharCode(...mid.subarray(14, 18)) === "MTrk", "a drum pattern as a MIDI file: its chunks");
    const body = mid.subarray(22); let on = 0; for (let i = 0; i + 2 < body.length; i++) if (body[i] === 0x99) on++;
    check(on >= d0.cells.filter(u => u.s >= Math.min(d0.first, d0.last) && u.s <= Math.max(d0.first, d0.last)).length, `its hits are note-ons on channel 10: ${on}`);
    let refused = null; try { await SD.Patterns.put(sa, 16, db); } catch (e) { refused = e.message; }
    check(refused === "pat-kind", "a drum pattern does not go on a note track");
  }
  const mp = SD.patMidi(await SD.Patterns.get(sa, full[0]), full[0], 2), hd = new DataView(mp.buffer);
  check(hd.getUint32(4) === 6 && hd.getUint16(8) === 0 && hd.getUint16(12) === 480 && hd.getUint32(18) === mp.length - 22, "a note pattern as a MIDI file: format 0, 480 ticks, its length");
  {
    let i = 22, t = 0; const pm = SD.patParse(await SD.Patterns.get(sa, full[0])), vlq = () => { let v = 0, c; do { c = mp[i++]; v = v << 7 | (c & 127); } while (c > 127); return v; };
    while (i < mp.length) { t += vlq(); i += mp[i] === 0xFF ? 3 + mp[i + 2] : 3; }
    const stepT = [40, 60, 80, 120, 160, 240, 320, 480][pm.rate], len = (Math.abs(pm.last - pm.first) + 1) * stepT;
    check(t === len, `the file is one loop of the pattern: ${t} ticks = ${len}`);
  }
  const m = SD.patParse(await SD.Patterns.get(sa, full[0]));
  check(m.steps.some(s => s.units.some(u => u.on)) && m.lanes.length === 12 && m.lanes[0].length === 192, "the pattern's notes and lanes parsed");
  const edit = SD.patParse(await SD.Patterns.get(sb, M + 3)), base = await SD.Patterns.get(sb, M + 3);
  edit.steps[5].units[0] = {on: true, note: 60, gate: 6, tie: 0, micro: 2, vel: 100}; edit.steps[5].b3 = 0x80 | 2;
  const built = SD.patBuild(edit, base);
  check(built[5 * 28] === 1 && hex(built.subarray(5 * 28 + 4, 5 * 28 + 8)) === "3c060264" && built[5 * 28 + 3] === 0x82, "a note added: the unit's four bytes, the mask, the step's byte [3]");
  edit.steps[5].units[0] = {...edit.steps[5].units[0], on: false}; edit.steps[5].b3 = base[5 * 28 + 3];
  check(eq(SD.patBuild(edit, built), base), "and removed: back to the empty unit (00 00 00 60)");
  await SD.transfer(SD.Patterns, sa, [full[0]], sb, [M + 10], {}, ctx);
  await SD.transfer(SD.Patterns, sa, [full[1]], sa, [M + 15], {move: true}, ctx);
  await SD.Patterns.clear(sa, full[2]); await SD.Patterns.flush(sa, ctx);
  check((await SD.Patterns.list(sa))[full[1]].empty && (await SD.Patterns.list(sb))[M + 10].notes > 0, "patterns: copied, moved, cleared");

  // ---- CC presets
  const fac = hex(SD.ccDefault());
  check(fac === E.ccFactory, "the factory presets = the 960 bytes of a running device's RAM");
  const set = {bytes: SD.ccDefault(), dirty: false}, ps = {set};
  const r = SD.ccParse(await SD.CC.get(ps, 2));
  check(r.map(x => x.param).join() === "1,2,5,11,12,13,71,74" && r.every(x => x.type === 1 && x.start === 0 && x.end === 127), "the factory records parsed");
  r[0].param = 300; r[0].type = 2; r[0].end = 16383; r[1].flags |= 2;
  await SD.CC.put(ps, 2, SD.ccBuild(r, await SD.CC.get(ps, 2)));
  const r2 = SD.ccParse(await SD.CC.get(ps, 2));
  check(r2[0].param === 300 && r2[0].type === 2 && r2[0].end === 16383 && r2[1].flags === 3 && set.dirty, "a record edited: 14-bit NRPN, inverted");
  await SD.transfer(SD.CC, ps, [2], ps, [5], {swap: true}, {});
  check(SD.ccParse(await SD.CC.get(ps, 5))[0].param === 300 && SD.ccParse(await SD.CC.get(ps, 2))[0].param === 1, "presets swapped");
  await SD.CC.clear(ps, 5);
  check(hex(await SD.CC.get(ps, 5)) === fac.slice(0, 240), "a preset back to factory");

  // ---- swap and overlap, on samples (a scratch pack copy would hide nothing: Alpha's own slots)
  const nb = await SD.Nova.list(pb), before = (await SD.Nova.get(pb, 0)).slice(), other = (await SD.Nova.get(pb, 2)).slice();
  await SD.transfer(SD.Nova, pb, [0], pb, [2], {move: true, swap: true}, ctx);
  check(eq(await SD.Nova.get(pb, 0), other) && eq(await SD.Nova.get(pb, 2), before), `Nova swapped (${nb[0].name} <-> ${nb[2].name})`);
  await SD.transfer(SD.Nova, pb, [0], pb, [2], {move: true, swap: true}, ctx);
  const n3 = (await SD.Nova.get(pb, 3)).slice(), n4 = (await SD.Nova.get(pb, 4)).slice(), n5 = (await SD.Nova.get(pb, 5)).slice();
  await SD.transfer(SD.Nova, pb, [3, 4], pb, [4, 5], {move: true}, ctx);              // the two ranges overlap
  check((await SD.Nova.get(pb, 3)) === null && eq(await SD.Nova.get(pb, 4), n3) && eq(await SD.Nova.get(pb, 5), n4), "a move over itself: read first, slot 3 emptied");
  await SD.transfer(SD.Nova, pb, [4, 5], pb, [3, 4], {move: true}, ctx);
  await SD.Nova.put(pb, 5, n5, ctx);
  check(eq(await SD.Nova.get(pb, 3), n3) && eq(await SD.Nova.get(pb, 4), n4), "and back");

  // ---- packs
  const cp = await SD.copyPack(B, c, 7, ctx);
  check(cp && cp.slot === 7 && cp.folder === "07" + E.beta.slice(2), `pack copied: ${cp.folder}`);
  threw = null; try { await SD.copyPack(A, c, 7, ctx); } catch (e) { threw = e.message; }
  check(threw === "slot-used", "a pack does not land on a pack");
  const mv = await SD.movePack(A, c, 9, ctx);
  check(mv.folder === "09_Alpha" && !c.pack(0) && c.packs.length === 3, `pack moved: ${c.packs.map(p => p.folder)}`);

  // ---- the result, file by file, against the other implementation
  const got = DEV ? await (await fetch("/tree")).json() : await walk(tracks), want = {...E.tree};
  if (DEV) for (const n of Object.keys(want)) if (/\.bak$|SC34D/.test(n)) delete want[n];
  const names = new Set([...Object.keys(got), ...Object.keys(want)]);
  let bad = 0;
  for (const n of names) {
    const h = got[n] ? (DEV ? got[n] : await sha(got[n])) : null;
    if (h !== want[n]) { bad++; lines.push(`  differs: ${n} (${got[n] ? got[n].length : "missing"})`); check(false, "differs: " + n); }
  }
  check(!bad, `the whole card = what tools/sd_app_fixture.py did on its own (${names.size} files)`);

  // ---- delete, and the backups
  await SD.deletePack(c.pack(7), ctx);
  check(c.packs.length === 2 && !c.pack(7), "pack deleted");
  const kept = await walk(bak), stamp = Object.keys(kept)[0].split("/")[0];
  const backed = n => kept[`${stamp}/${n}`];
  const orig = n => originals[n];
  check(eq(backed(`${E.beta}/Sessions/00_Garbage.ncs`), orig(`${E.beta}/Sessions/00_Garbage.ncs`)), "backup: a session as it was on the card");
  check(eq(backed("00_Alpha/Patches/00_PATCHBANK.cpb"), orig("00_Alpha/Patches/00_PATCHBANK.cpb")), "backup: the bank's first version, not a later one");
  const samp = Object.keys(originals).find(k => k.startsWith("00_Alpha/PCM/03_"));
  check(eq(backed(samp), originals[samp]), "backup: a deleted sample");
  check(Object.keys(kept).some(k => k.startsWith(`${stamp}/07${E.beta.slice(2)}/`)), "backup: the deleted pack");

  // ---- rename: only the name changes (the slot, the bytes, what the projects use stay)
  {
    const why = (kind, s) => { try { SD.checkName(kind, s); return "ok"; } catch (e) { return e.message; } };
    check(why("drums", "Kick 01") === "ok" && why("drums", "x".repeat(23)) === "ok" && why("drums", "x".repeat(24)) === "name-long" && why("drums", "a/b") === "name-chars-file" &&
          why("drums", 'a"b') === "name-chars-file" && why("drums", "Kick.") === "name-end" && why("drums", "Caña") === "name-chars-file" && why("drums", "  ") === "name-empty" && why("packs", "x".repeat(28)) === "name-long",
          "names: ASCII without FAT's characters, no trailing dot, within the length (sample 23 + NN_ + .wav = 30, pack 27 + NN_ = 30)");
    check(SD.folderName(1, SD.checkName("packs", "x".repeat(27))).length === 30 && why("nova", "A/B 'x'") === "ok" && why("nova", "") === "name-empty" && why("custom", "") === "ok" && why("custom", "é") === "name-chars",
          "a pack name fills the 30 characters; inside a file / and ' are fine, accents are not");
    const m9 = c.pack(9), pm = {pack: m9}, useBefore = useList(await SD.usageOf(m9));
    const dl = await SD.Drums.list(pm), k = dl.findIndex(x => !x.empty), sb0 = (await SD.Drums.get(pm, k)).bytes;
    await SD.Drums.setName(pm, k, "Renamed Kick", ctx);
    const dl2 = await SD.Drums.list(pm);
    check(dl2[k].name === "Renamed Kick" && eq((await SD.Drums.get(pm, k)).bytes, sb0) && dl2.filter(x => !x.empty).length === dl.filter(x => !x.empty).length,
          `a sample renamed: ${dl[k].name} -> ${dl2[k].name}, the same slot and bytes`);
    await SD.Drums.setName(pm, k, "RENAMED KICK", ctx);
    check((await SD.Drums.list(pm))[k].name === "RENAMED KICK" && eq((await SD.Drums.get(pm, k)).bytes, sb0), "a rename in the case only");
    const diff = (a, b) => { const o = []; for (let i = 0; i < Math.max(a.length, b.length); i++) if (a[i] !== b[i]) o.push(i); return o; };
    const nk = (await SD.Nova.list(pm)).findIndex(x => !x.empty), bank = async n => (await SD.banksOf(m9)).get(n >> 3).bytes.slice();
    const nb0 = await bank(nk);
    await SD.Nova.setName(pm, nk, "Night Pad/2"); m9.drop();
    const nd = diff(nb0, await bank(nk)), no = 512 * (nk & 7);
    check((await SD.Nova.list(pm))[nk].name === "Night Pad/2" && nd.length && nd.every(i => i >= no && i < no + 16), `a Nova patch renamed: only its 16 name bytes change (${nd.length})`);
    const ck = (await SD.Custom.list(pm)).findIndex(x => !x.empty && !x.bad);
    if (ck >= 0) {
      const cb0 = await bank(ck);
      await SD.Custom.setName(pm, ck, "Wobble", ctx); m9.drop();
      const cd = diff(cb0, await bank(ck)), co = 512 * (ck & 7) + SD.PSZ + 44, pad = await SD.Custom.get(pm, ck);
      check(SD.ctmName(pad) === "Wobble" && SD.ctmState(pad) === "ok" && cd.every(i => i >= co && i < co + 16), "a custom patch renamed: only its name bytes, the patch still good");
    }
    check(useList(await SD.usageOf(m9)).join("|") === useBefore.join("|"), "the projects use the same things after the renames");
    const t0 = await SD.treeInfo(m9.dir);
    const rn = await SD.renamePack(m9, "Alpha Renamed", ctx);
