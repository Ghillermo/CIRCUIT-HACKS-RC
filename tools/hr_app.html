<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hacks + Remix</title>
<style>
  :root { --bg:#111317; --panel:#1a1d23; --panel2:#14171c; --line:#2b2f38; --ink:#e8e9ec; --dim:#9aa0ab; --ok:#7ee787; --warn:#ffb86b; --bad:#ff7b72; --acc:#79c0ff; --sel:#23405e; --dst:#2f4a2f; }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; display:flex; flex-direction:column; background:var(--bg); color:var(--ink); font:14px/1.45 system-ui,"Segoe UI",sans-serif; }
  header { display:flex; gap:12px; align-items:center; flex-wrap:wrap; padding:10px 16px 6px; }
  h1 { font-size:1.1rem; margin:0; white-space:nowrap; }
  header .sub { color:var(--dim); font-size:.85rem; }
  header .right { margin-left:auto; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  button { font:inherit; font-weight:600; background:#2b2f38; color:var(--ink); border:0; border-radius:6px; padding:5px 11px; cursor:pointer; }
  button:hover:not(:disabled) { background:#363b45; }
  button.pri { background:var(--acc); color:#0b0d10; }
  button.pri:hover:not(:disabled) { background:#9ad0ff; }
  button.dng { background:#5a2a28; color:#ffd7d3; }
  button.dng:hover:not(:disabled) { background:#74332f; }

  nav { display:flex; gap:2px; padding:0 16px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  nav button { background:none; color:var(--dim); border-radius:6px 6px 0 0; padding:7px 14px; }
  nav button.on { background:var(--panel); color:var(--ink); box-shadow:inset 0 -2px 0 var(--acc); }
  #notice { padding:6px 16px; color:var(--warn); }
  #notice:empty { display:none; }
  main { flex:1; min-height:0; display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:10px 16px; }
  .pane { min-width:0; min-height:0; display:flex; flex-direction:column; background:var(--panel); border:1px solid var(--line); border-radius:8px; overflow:hidden; }

  .prow { display:flex; gap:6px; align-items:center; flex-wrap:wrap; min-width:0; }
  .prow .grow { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  select, input[type=text], input[type=number] { font:inherit; color:var(--ink); background:#0f1114; border:1px solid var(--line); border-radius:6px; padding:4px 6px; }
  input.badin { border-color:var(--bad); }
  select { max-width:100%; min-width:0; flex:1; }
  input[type=number] { width:68px; }
  input[type=range] { accent-color:var(--acc); width:100%; }
  .dim { color:var(--dim); } .ok { color:var(--ok); } .warn { color:var(--warn); } .bad { color:var(--bad); }
  .tool { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }

  .row .c2 { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  .row:hover { background:#20242c; }
  .row.sel { background:var(--sel); }
  .play { padding:0 6px; font-size:.75rem; line-height:18px; }
  canvas.wave { width:100%; height:44px; display:block; background:#0f1114; border-top:1px solid var(--line); }
  .row canvas.mini { vertical-align:middle; margin-right:8px; }
  .plist .row { grid-template-columns:34px 78px minmax(0,1fr) minmax(0,auto) 30px; }

  .use.free { color:#5c626d; font-weight:400; }
  .use.ghost { color:var(--warn); }
  .usebox { border-top:1px solid var(--line); padding:4px 10px; font-size:.82rem; color:var(--dim); max-height:7.5em; overflow:auto; }
  .usebox[hidden] { display:none; }

  .pvw { border-top:1px solid var(--line); }

  .pvw .cap { padding:4px 10px; font-size:.82rem; color:var(--dim); }
  .pvw canvas { width:100%; height:150px; display:block; background:#0f1114; }
  .blank { padding:28px 20px; text-align:center; color:var(--dim); }
  .blank button { margin-top:10px; }
  footer { padding:0 16px 10px; }
  #prog { width:100%; height:6px; display:block; margin-bottom:4px; }
  #prog[hidden], #progtxt[hidden] { display:none; }
  #progtxt { font-size:.8rem; color:var(--dim); margin-bottom:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-variant-numeric:tabular-nums; }
  #log { height:84px; overflow:auto; background:#0b0d10; border:1px solid var(--line); border-radius:6px; padding:5px 8px; font:12px/1.4 ui-monospace,Consolas,monospace; white-space:pre-wrap; }
  dialog { background:var(--panel); color:var(--ink); border:1px solid var(--line); border-radius:10px; padding:16px; max-width:560px; }
  dialog::backdrop { background:rgba(0,0,0,.6); }
  dialog h3 { margin:0 0 8px; font-size:1rem; }
  dialog .body { max-height:50vh; overflow:auto; }
  dialog .btns { display:flex; gap:8px; justify-content:flex-end; margin-top:14px; flex-wrap:wrap; }
  dialog ul { margin:6px 0; padding-left:18px; }
  dialog.wide { max-width:min(1180px,96vw); width:96vw; }
  dialog.wide .body { max-height:none; }
  .form { display:grid; grid-template-columns:repeat(auto-fill,minmax(330px,1fr)); gap:10px; max-height:62vh; overflow:auto; padding-right:6px; }
  fieldset { border:1px solid var(--line); border-radius:8px; padding:6px 10px 8px; min-width:0; margin:0; }
  legend { color:var(--dim); font-size:.8rem; padding:0 4px; }
  .fld { display:grid; grid-template-columns:minmax(0,150px) minmax(0,1fr) 62px; gap:8px; align-items:center; min-height:26px; }
  .fld > span { font-size:.85rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .fld input[type=number] { width:62px; padding:2px 4px; }
  .line2 { display:flex; gap:12px; flex-wrap:wrap; align-items:center; margin-bottom:8px; }
  .line2 label { display:flex; gap:6px; align-items:center; font-size:.85rem; }
  .line2 select { flex:none; }
  .dxl { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:2px 12px; max-height:55vh; overflow:auto; font-size:.85rem; }
  .dxl label { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .edgrid { display:grid; grid-template-columns:minmax(0,1fr) 250px; gap:12px; }
  .roll { height:44vh; overflow:auto; border:1px solid var(--line); border-radius:6px; background:#0f1114; }
  .roll canvas, .bars canvas { display:block; }
  .bars { margin-top:6px; overflow-x:auto; border:1px solid var(--line); border-radius:6px; background:#0f1114; }
  .insp fieldset { margin-bottom:8px; }
  .insp .fld { grid-template-columns:minmax(0,1fr) 72px; }
  .cct { width:100%; border-collapse:collapse; }
  .cct th { color:var(--dim); font-size:.8rem; font-weight:600; text-align:left; padding:2px 6px; }
  .cct td { padding:2px 6px; }
  @media (max-width:900px) { main { grid-template-columns:1fr; grid-auto-rows:minmax(320px,1fr); overflow:auto; } .edgrid { grid-template-columns:1fr; } }

  .kind { font-size:.75rem; padding:1px 6px; border-radius:4px; border:1px solid var(--line); color:var(--dim); }
  .kind.t { color:#79c0ff; border-color:#79c0ff; } .kind.r { color:#ffb86b; border-color:#ffb86b; } .kind.f { color:#7ee787; border-color:#7ee787; }

<body>
<header>
  <h1>Hacks + Remix</h1>
  <span class="sub" id="sub"></span>
  <div class="right">
    <button id="bBackup" type="button"></button>
    <div class="lang" role="group" aria-label="Idioma / Language"><button type="button" data-lang="es">Español</button><button type="button" data-lang="en">English</button></div>
  </div>
</header>
<nav id="tabs" role="tablist"></nav>
<div id="notice"></div>
<main><section class="pane" id="pane0"></section><section class="pane" id="pane1"></section></main>
<footer><progress id="prog" hidden></progress><div id="progtxt" hidden></div><div id="log" role="log"></div></footer>
<dialog id="dlg"></dialog>
<script id="core-tracks">
/* The microSD card of a Circuit Tracks, read and written from the browser (File System Access API).  No DOM here: the interface is the next script,
and tools/sd_app_test.html runs this one on its own.

The formats (docs/NOTAS.md, tools/patchtool.py, tools/mpatch.py, tools/projsyn.py):
  * a pack = Tracks/NN_Name (NN 00..30 = the device's packs 1..31; pack 0 is the internal memory; names cut at 30 characters), with Sessions, Patches,
    PCM, meta (and the effects folder, carried by a pack copy as any other folder);
  * the firmware finds a file by its NN_ prefix alone: a stray NN_something in those folders can be taken instead of the real file (this happened: the
    NN_SC34D.bin files of a diagnostic hid the sessions).  So nothing of ours is ever left in a pack: backups go to a folder outside it;
  * Patches/NN_PATCHBANK.cpb = 8 records of 512 B: 340 of a Nova patch + 172 of padding; the padding of record n is the own-synth patch n;
  * PCM/NN_Name.wav = 64 samples;
  * Sessions/NN_Name.ncs = 160 780 B; MIDI 1 / 2's patterns = 2 x 8 x 3 240 B at 0x1A27C;
  * the 8 CC presets (MIDI templates) are NOT on the card: the device keeps them in its internal memory (_GLOB.cg, volume 0, keys 0x1F + i).  Here they
    are a file of 8 x 120 B, the device's own records, or the device itself over USB.
The device, connected by USB, is one more folder: Device / DevRoot below speak the stock file protocol behind the same calls as a folder handle. */
const SDT = (() => {
"use strict";
const REC = 512, PSZ = 340, PADN = 172, PER = 8, BANKS = 16, SLOTS = 128;
const NSAMPLES = 64, NSESS = 64, NPACKS = 31, FOLDER_MAX = 30;
const SYNTH0 = 0x2E4, DRUM0 = 0xCD74, DPAT = 0x6A8, DSETT = 0x80, DLANE0 = 0xA8, DLANES = 8, NPATS = 64, DRUM_NOTE = [60, 62, 64, 65];
const SESS_SIZE = 0x2740C, MIDI0 = 0x1A27C, PAT = 0xCA8, NSTEPS = 32, STEP = 28, UNITS = 6, SETT = 0x380, SETN = 40, LANE0 = 0x3A8, NLANES = 12, MICRO = 6;
const WORDS_MAX = 0x900000;                                 // the stock's loader stops at Y:$E80000: 9 437 184 words from $580000
const TPL = 0x78, NTPL = 8, TPL_HEAD = 0x28, TPL_REC = 10, CC_DEF = [1, 2, 5, 11, 12, 13, 71, 74];
const NAME_AT = 44, NAME_LEN = 16, FM_AT = 100, FM_LEN = 21, VM_AT = 126, VM_TAG = 0xB6, VM_BASE = 0x50;
const FM_DEF = [11, 11, 11, 11, 127, 64, 48, 32, 64, 64, 64, 64, 0, 0, 0, 64];     // fmeng.DEFAULTS2
const CTM_DEF = [0, 0, 0, 0, 0, 0, 127, 0, 0, 0, 40, 0, 0, 60, 63, 0, 0, 0, 0, 50, 0, 0, 0, 0, 0, 0, 0, 0, 0, 50, 64, 0, 0, 0];   // patchtool.DEFAULTS, codes 1..34

const pad2 = n => String(n).padStart(2, "0");
const TRACK_NAME = ["Synth 1", "Synth 2", "MIDI 1", "MIDI 2", "Drum 1", "Drum 2", "Drum 3", "Drum 4"];
const isFF = (b, a, n) => { for (let i = a; i < a + n; i++) if (b[i] !== 0xFF) return false; return true; };
function latin(b, a, n) { let s = ""; for (let i = a; i < a + n; i++) s += String.fromCharCode(b[i]); return s.replace(/[\s\0]+$/, ""); }
const same = (a, b) => a === b || (!!a.pack && a.pack === b.pack && a.sess === b.sess) || (!!a.set && a.set === b.set);

// ---------------------------------------------------------------- the file system
async function entries(dir) {
  const out = [];
  for await (const [name, h] of dir.entries()) out.push([name, h]);
  return out.sort((a, b) => a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : 0);
}
async function subdir(dir, name, create = false) {
  try { return await dir.getDirectoryHandle(name, {create}); }
  catch (e) { if (e.name === "NotFoundError" || e.name === "TypeMismatchError") return null; throw e; }
}
const readHandle = async h => new Uint8Array(await (await h.getFile()).arrayBuffer());
async function writeFile(dir, name, bytes) {
  const w = await (await dir.getFileHandle(name, {create: true})).createWritable();
  try { await w.write(bytes); await w.close(); }
  catch (e) { try { await w.abort(); } catch (_) { /* the write's own error is the one to report */ } throw e; }
}
async function treeInfo(dir) {
  let files = 0, bytes = 0;
  for (const [, h] of await entries(dir)) {
    if (h.kind === "directory") { const t = await treeInfo(h); files += t.files; bytes += t.bytes; }
    else { files++; bytes += (await h.getFile()).size; }
  }
  return {files, bytes};
}
async function copyTree(src, dst, tick) {
  for (const [n, h] of await entries(src)) {
    if (/\.crswap$/i.test(n) || (h.kind === "directory" && dst.accepts && !dst.accepts(n))) continue;     // the browser's temporary file; a folder the device has no type for
    if (h.kind === "directory") await copyTree(h, await dst.getDirectoryHandle(n, {create: true}), tick);
    else { const b = await readHandle(h); await writeFile(dst, n, b); if (tick) tick(n, b.length); }
  }
}
async function sameTree(a, b) {                             // every file of a is in b with its size
  for (const [n, h] of await entries(a)) {
    if (/\.crswap$/i.test(n) || (h.kind === "directory" && b.accepts && !b.accepts(n))) continue;
    if (h.kind === "directory") { const d = await subdir(b, n); if (!d || !await sameTree(h, d)) return false; continue; }
    let f; try { f = await (await b.getFileHandle(n)).getFile(); } catch (_) { return false; }
    if (f.size !== (await h.getFile()).size) return false;
  }
  return true;
}

// ---------------------------------------------------------------- backups: a folder of the user's, outside the packs
class Backup {
  constructor(dir, title) {
    this.dir = dir; this.title = title || dir.name; this.seen = new Set(); this.count = 0;
    const d = new Date(); this.stamp = `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}_${pad2(d.getHours())}${pad2(d.getMinutes())}${pad2(d.getSeconds())}`;
  }
  async folder(parts) { let h = await subdir(this.dir, this.stamp, true); for (const p of parts) h = await subdir(h, p, true); return h; }
  async file(parts, name, bytes) {                          // only the first version of a file in this run: the one that was on the card
    const key = parts.concat(name).join("/");
    if (this.seen.has(key)) return;
    await writeFile(await this.folder(parts), name, bytes); this.seen.add(key); this.count++;
  }
  async tree(src, parts) { await copyTree(src, await this.folder(parts), () => { this.count++; }); }
}

// ---------------------------------------------------------------- the card
class Pack {
  constructor(card, slot, name, folder, dir) { this.card = card; this.slot = slot; this.name = name; this.folder = folder; this.dir = dir; this.drop(); }
  drop() { this._banks = null; this._samples = null; this._sessions = null; this._open = new Map(); this._info = null; this._usage = null; }
}
class Card {
  constructor(root, tracks) { this.root = root; this.tracks = tracks; this.packs = []; }
  static async open(root) {
    const t = await subdir(root, "Tracks"), c = new Card(root, t || root);
    await c.scan();
    if (!c.packs.length && !t) throw new Error("no-packs");
    return c;
  }
  async scan() {
    const keep = new Map(this.packs.map(p => [p.folder, p])), out = [];
    for (const [n, h] of await entries(this.tracks)) {
      const m = /^(\d\d)_(.*)$/.exec(n);
      if (!m || h.kind !== "directory" || +m[1] >= NPACKS) continue;
      if (!(await subdir(h, "Patches") || await subdir(h, "PCM") || await subdir(h, "Sessions"))) continue;
      out.push(keep.get(n) || new Pack(this, +m[1], m[2], n, h));
    }
    this.packs = out;
  }
  async reset() { this.packs = []; await this.scan(); }
  pack(slot) { return this.packs.find(p => p.slot === slot) || null; }
}
function folderName(slot, name) { return (pad2(slot) + "_" + name).slice(0, FOLDER_MAX).replace(/[\s.]+$/, ""); }

async function packInfo(pack) {
  if (pack.dir.device) return null;                         // every pack's folders, one list at a time, is too slow over USB
  if (pack._info) return pack._info;
  const count = async (sub, re) => { const d = await subdir(pack.dir, sub); return d ? (await entries(d)).filter(e => re.test(e[0])).length : 0; };
  return pack._info = {sessions: await count("Sessions", /\.ncs$/i), banks: await count("Patches", /_PATCHBANK\.cpb$/i), samples: await count("PCM", /\.wav$/i)};
}
async function copyPack(pack, card, slot, ctx = {}) {
  if (card.packs.some(p => p.slot === slot)) throw new Error("slot-used");
  const folder = folderName(slot, pack.name), dst = await card.tracks.getDirectoryHandle(folder, {create: true});
  try {
    const all = await treeInfo(pack.dir); let done = 0;
    await copyTree(pack.dir, dst, n => { done++; if (ctx.progress) ctx.progress(n, done, all.files); });
    if (dst.finish) await dst.finish();
    if (!await sameTree(pack.dir, dst)) throw new Error("verify");
  } catch (e) { await card.tracks.removeEntry(folder, {recursive: true}); throw e; }
  await card.scan();
  return card.pack(slot);
}
async function deletePack(pack, ctx = {}) {
  if (ctx.backup) await ctx.backup.tree(pack.dir, [pack.folder]);
  const card = pack.card;
  await card.tracks.removeEntry(pack.folder, {recursive: true});
  await card.scan();
}
async function movePack(pack, card, slot, ctx = {}) {       // the API has no folder rename: a verified copy, then the source goes (no backup needed: the copy is it)
  if (pack.card === card && pack.slot === slot) return pack;
  if (pack.card === card && card.tracks.renameEntry) {      // the device can
    if (card.packs.some(p => p.slot === slot)) throw new Error("slot-used");
    await card.tracks.renameEntry(pack.folder, folderName(slot, pack.name));
    await card.reset();
    return card.pack(slot);
  }
  const out = await copyPack(pack, card, slot, ctx);
  await deletePack(pack, {});
  return out;
}

// ---------------------------------------------------------------- names: what the firmware, the card's FAT and the USB protocol all accept
/* A file or folder name: printable ASCII without the characters FAT refuses (\ / : * ? " < > |), no space or dot at either end (FAT drops a trailing
   one, so the name on the card would not be the name asked), and the whole name, NN_ and extension included, within 30 characters: the device's
   own names stop there, and over USB a name over 31 overwrites the firmware's stack.  The NN_ prefix is the slot and is never typed: every
   reference (sessions to samples and patches, the device to its packs) goes by that number, so a new name changes nothing but the name.
   Names inside a file (Nova patch 16, custom patch 16, CC preset 32): printable ASCII. */
const NAME_RULE = {packs: {file: true, max: FOLDER_MAX - 3}, drums: {file: true, max: 30 - 7}, nova: {max: 16, need: true}, custom: {max: NAME_LEN}, cc: {max: 32}};
const FAT_BAD = /[\\/:*?"<>|]/;
function checkName(kind, raw) {
  const r = NAME_RULE[kind], s = String(raw).trim();
  if (!r) throw new Error("name-kind");
  if (!/^[ -~]*$/.test(s) || (r.file && FAT_BAD.test(s))) throw new Error(r.file ? "name-chars-file" : "name-chars");
  if (r.file && /[ .]$/.test(s)) throw new Error("name-end");
  if (s.length > r.max) throw new Error("name-long");
  if (!s.length && (r.file || r.need)) throw new Error("name-empty");
  return s;
}
const caseOnly = (a, b) => a !== b && a.toLowerCase() === b.toLowerCase();
async function renameHandle(h, to) {                        // the browser's own move when it has one (no data copied); false = not done
  if (typeof h.move !== "function") return false;
  try { await h.move(to); return true; } catch (_) { return false; }
}
async function renamePack(pack, name, ctx = {}) {
  name = checkName("packs", name);
  const card = pack.card, to = folderName(pack.slot, name);
  if (to === pack.folder) return pack;
  if (card.tracks.renameEntry) await card.tracks.renameEntry(pack.folder, to);            // the device: a FatFs rename
  else if (!await renameHandle(pack.dir, to)) {                                            // a folder: a verified copy, then the old one goes
    const all = await treeInfo(pack.dir); let done = 0;
    const copy = async (src, n) => {
      const d = await card.tracks.getDirectoryHandle(n, {create: true});
      try { await copyTree(src, d, f => { done++; if (ctx.progress) ctx.progress(f, done, all.files * (caseOnly(pack.folder, to) ? 2 : 1)); }); if (!await sameTree(src, d)) throw new Error("verify"); }
      catch (e) { await card.tracks.removeEntry(n, {recursive: true}); throw e; }
      return d;
    };
    if (caseOnly(pack.folder, to)) {                        // a case-insensitive file system: the same folder; through a name the device ignores
      const tmp = "_renaming_" + pack.folder, t = await copy(pack.dir, tmp);
      await card.tracks.removeEntry(pack.folder, {recursive: true});
      await copy(t, to); await card.tracks.removeEntry(tmp, {recursive: true});
    } else {
      if (await subdir(card.tracks, to)) throw new Error("name-taken");
      await copy(pack.dir, to); await card.tracks.removeEntry(pack.folder, {recursive: true});
    }
  }
  await card.reset();
  return card.pack(pack.slot);
}
async function renameFile(dir, from, to, ctx = {}, parts = []) {   // one file of a folder; the device renames, the PC moves or copies
  if (from === to) return;
  if (dir.renameEntry) return dir.renameEntry(from, to);
  const h = await dir.getFileHandle(from);
  if (await renameHandle(h, to)) return;
  const b = await readHandle(h);

  if (tab === "patterns") return {name: it.name, bytes: await core(p).Patterns.get({pack: pl.pack, sess: p.sess}, n), from: p.kind, slot: n};
  if (p.kind === "rhythm") { const r = await RFM.get(pl, n); return r ? {name: `Remix ${SDR.pad2(n)}`, rec: r} : null; }
  const pad = await SDT.Custom.get(pl, n); return pad ? {name: SDT.ctmName(pad) || `Hacks ${SDT.pad2(n)}`, pad, rec: HR.fmOfCustom(pad)} : null;
}
async function putItem(q, n, x, ctx) {                       // into pane q's slot n (a folder: a new file)
  const tab = state.tab;
  if (q.kind === "folder") {
    const ext = tab === "samples" ? ".wav" : tab === "patterns" ? (x.from === "rhythm" ? ".rmpat" : ".ctpat") : x.pad ? ".ctm" : ".fm8";
    const data = tab === "fm" ? (x.pad || x.rec) : x.bytes;
    let name = (x.name || "item").replace(/[\\/:*?"<>|]/g, "_").trim() + ext;
    for (let k = 2; await q.dir.getFileHandle(name).then(() => true, () => false); k++) name = name.replace(/( \d+)?(\.[^.]+)$/, ` ${k}$2`);
    await SDT.writeFile(q.dir, name, data); return;
  }
  const pl = place(q);
  if (tab === "samples") return (q.kind === "rhythm" ? SDR.Samples : SDT.Drums).put(pl, n, {name: x.name, bytes: x.bytes}, ctx);
  if (tab === "patterns") {
    const P = core(q).Patterns, ql = {pack: pl.pack, sess: q.sess}, base = await P.get(ql, n);
    if (x.from === "tracks" && q.kind === "tracks" && (x.slot >= 32) !== (n >= 32)) throw new Error(T("un patrón de drums solo va a una pista de drums", "a drum pattern only goes to a drum track"));
    const data = HR.adaptPattern(x.bytes, x.from, x.slot, base, q.kind, n);
    if (data.length !== base.length) throw new Error(T("tamaño de patrón distinto", "pattern size differs"));
    await P.putRaw(ql, n, data); await P.flush(ql, ctx); return;
  }
  if (q.kind === "rhythm") { if (!x.rec) throw new Error(T(`${x.name}: no es un parche FM de 8 operadores (el Rhythm no tiene los otros motores)`, `${x.name}: not an 8-operator FM patch (the Rhythm has no other engines)`)); return RFM.put(pl, n, x.rec, ctx); }
  const pad = x.pad && SDT.ctmState(x.pad.subarray(0, SDT.PADN)) === "ok" ? x.pad : HR.customOfFm(x.rec, x.name);
  if (!pad) throw new Error(T(`${x.name}: sin datos de FM`, `${x.name}: no FM data`));
  return SDT.Custom.put(pl, n, pad, ctx);
}

async function copyAct(p) {
  const q = p.other, from = [...p.sel].sort((a, b) => a - b).filter(n => p.items[n] && !p.items[n].empty);
  if (!from.length) return say(T("Nada elegido", "Nothing chosen"), T("Elige filas con contenido.", "Choose rows with content."));
  if (!q.kind) return say(T("Falta el destino", "No target"), T("Abre una carpeta en el otro lado.", "Open a folder on the other side."));
  if (state.tab === "patterns" && q.kind !== "folder" && q.sess === null) return say(T("Sin proyecto", "No project"), T("El otro lado no tiene un proyecto elegido.", "The other side has no project chosen."));
  let to = [];
  if (q.kind !== "folder") {
    const start = q.sel.size ? Math.min(...q.sel) : q.items.findIndex(x => x.empty);
    if (start < 0) return say(T("No cabe", "It does not fit"), T("Elige el hueco de destino en el otro lado.", "Choose the target slot on the other side."));
    to = from.map((_, i) => start + i);
    if (to[to.length - 1] >= q.items.length) return say(T("No cabe", "It does not fit"), T("No hay huecos suficientes desde el elegido.", "Not enough slots from the chosen one."));
    const hit = to.filter(n => !q.items[n].empty);
    if (hit.length && !await ask(T("Huecos ocupados", "Slots in use"), `<p>${hit.map(n => esc(`${n} ${q.items[n].name}`)).join("<br>")}</p>`, [[T("Sobrescribir", "Overwrite"), true, "dng"], [T("Cancelar", "Cancel"), false]])) return;
  }
  const across = p.kind !== q.kind && p.kind !== "folder" && q.kind !== "folder";
  await run(`${T("Copiar", "Copy")} ${from.length}${across ? " · " + T("adaptado", "adapted") : ""}`, async ctx => {
    for (let i = 0; i < from.length; i++) {
      const x = await getItem(p, from[i]);
      if (!x) continue;
      try { await putItem(q, to[i], x, ctx); } catch (e) { log(`${x.name}: ${e.message || e}`, "bad"); }
      ctx.progress("", i + 1, from.length);
    }
    for (const k of [p, q]) { const pk = pack(k); if (pk) { pk._samples = null; pk._banks = null; pk._fmb = null; pk._info = null; } }
  });
  q.sel.clear();
}

// ---- drawing
function paneHtml(p) {
  let s = `<div class="prow"><b class="grow">${esc(p.dir ? p.dir.name : T("Sin carpeta", "No folder"))}</b>${p.kind ? `<span class="kind ${p.kind[0]}">${esc(kindLabel(p.kind))}</span>` : ""}<button type="button" data-act="open">${T("Abrir carpeta…", "Open folder…")}</button></div>`;
  if (p.card) {
    s += `<div class="prow"><select data-sel="pack">${p.card.packs.map(x => `<option value="${x.slot}"${x.slot === p.packSlot ? " selected" : ""}>${SDT.pad2(x.slot)} ${esc(x.name)}</option>`).join("")}</select>`;
    if (state.tab === "patterns") s += `<select data-sel="sess"></select>`;
    s += "</div>";
  }
  s += `<div class="tool"><button type="button" class="pri" data-act="copy">${p.i ? "← " : ""}${T("Copiar", "Copy")}${p.i ? "" : " →"}</button><span class="hint">${esc(hintOf(p))}</span></div><div class="list"></div>`;
  return s;
}
function hintOf(p) {
  const q = p.other;
  if (!p.kind || !q.kind || p.kind === q.kind || p.kind === "folder" || q.kind === "folder") return "";
  return state.tab === "patterns" ? T("Tracks → Rhythm: la nota más grave de cada paso; Rhythm → Tracks: una nota por paso", "Tracks → Rhythm: each step's lowest note; Rhythm → Tracks: one note a step")
       : state.tab === "fm" ? T("solo el FM de 8 operadores", "8-operator FM only") : T("los WAV tal cual", "the WAVs as they are");
}
async function render(p) {
  p.el.innerHTML = paneHtml(p);
  try { p.items = p.kind ? await loadItems(p) : []; } catch (e) { p.items = []; log(e.message || String(e), "bad"); }
  const ss = p.el.querySelector('[data-sel="sess"]');
  if (ss) { const m = await core(p).sessionsOf(pack(p)); ss.innerHTML = [...m.values()].map(e => `<option value="${e.slot}"${e.slot === p.sess ? " selected" : ""}>${SDT.pad2(e.slot)} ${esc(e.label || "")}</option>`).join(""); }
  const l = p.el.querySelector(".list");
  l.innerHTML = p.items.map((it, n) => `<div class="row${it.empty ? " empty" : ""}${p.sel.has(n) ? " sel" : ""}" data-n="${n}"><span class="c0">${p.kind === "folder" ? "" : SDT.pad2(it.slot)}</span><span class="c1"></span><span class="c2">${esc(it.empty ? "—" : it.name || T("(sin nombre)", "(no name)"))}</span><span class="c3">${esc(it.extra || "")}</span><span></span></div>`).join("") ||
    `<div class="blank dim" style="padding:10px">${p.kind ? T("Nada aquí.", "Nothing here.") : T("Abre una tarjeta (o una copia / snapshot) del Tracks o del Rhythm, o una carpeta de ficheros.", "Open a Tracks or Rhythm card (or a copy / snapshot), or a folder of files.")}</div>`;
}
async function renderAll() {
  document.documentElement.lang = LANG;
  $("sub").textContent = T("Hacks (Circuit Tracks) y Remix (Circuit Rhythm): samples, patrones y parches FM entre los dos, y carpetas", "Hacks (Circuit Tracks) and Remix (Circuit Rhythm): samples, patterns and FM patches between them, and folders");
  $("tabs").innerHTML = TABS.map(t => `<button type="button" data-tab="${t[0]}" class="${t[0] === state.tab ? "on" : ""}">${esc(T(t[1], t[2]))}</button>`).join("");
  for (const b of document.querySelectorAll(".lang button")) b.classList.toggle("on", b.dataset.lang === LANG);
  $("bBackup").textContent = state.backup ? T("Copias: ", "Backups: ") + state.backup.dir.name : T("Copias de seguridad…", "Backups…");
  $("notice").textContent = window.showDirectoryPicker ? "" : T("Este navegador no puede abrir carpetas: usa Chrome o Edge en un ordenador.", "This browser cannot open folders: use Chrome or Edge on a computer.");
  for (const p of panes) await render(p);
}

// ---- events
$("tabs").addEventListener("click", e => { const t = e.target.dataset && e.target.dataset.tab; if (t && !state.busy) { state.tab = t; for (const p of panes) p.sel.clear(); renderAll(); } });
for (const b of document.querySelectorAll(".lang button")) b.onclick = () => { LANG = b.dataset.lang; try { localStorage.setItem("hrapp.lang", LANG); } catch (_) { /* none */ } renderAll(); };
$("bBackup").onclick = async () => { let d; try { d = await window.showDirectoryPicker({mode: "readwrite"}); } catch (_) { return; } state.backup = new SDT.Backup(d, d.name); renderAll(); };
for (const p of panes) {
  p.el.addEventListener("click", async e => {
    if (state.busy) return;
    const act = e.target.dataset ? e.target.dataset.act : null;
    if (act === "open") { let d; try { d = await window.showDirectoryPicker({mode: "readwrite"}); } catch (_) { return; } try { await openPane(p, d); } catch (er) { log(er.message || String(er), "bad"); } return; }
    if (act === "copy") return copyAct(p);
    const row = e.target.closest(".row"); if (!row) return;
    const n = +row.dataset.n;
    if (e.ctrlKey || e.metaKey) { p.sel.has(n) ? p.sel.delete(n) : p.sel.add(n); }
    else if (e.shiftKey && p.sel.size) { const a = Math.min(...p.sel); p.sel = new Set(); for (let k = Math.min(a, n); k <= Math.max(a, n); k++) p.sel.add(k); }
    else p.sel = new Set([n]);
    for (const r of p.el.querySelectorAll(".row")) r.classList.toggle("sel", p.sel.has(+r.dataset.n));
  });
  p.el.addEventListener("change", async e => {
    const w = e.target.dataset ? e.target.dataset.sel : null;
    if (w === "pack") { p.packSlot = +e.target.value; p.sess = null; p.sel.clear(); await render(p); }
    else if (w === "sess") { p.sess = +e.target.value; p.sel.clear(); await render(p); }
  });
}
window.HRAPP = {state, panes, openPane, renderAll, copyAct, ask: null};
renderAll();
})();

</script>
</body>
</html>
