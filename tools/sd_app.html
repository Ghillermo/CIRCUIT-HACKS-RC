<script id="core">
/* The microSD card of a Circuit Tracks, read and written from the browser (File System Access API).  No DOM here: the interface is the next script,
and tools/sd_app_test.html runs this one on its own.

The formats (docs/NOTAS.md, tools/patchtool.py, tools/mpatch.py, tools/projsyn.py):
  * a pack = Tracks/NN_Name (NN 00..30 = the device's packs 1..31; pack 0 is the internal memory; names cut at 30 characters), with Sessions, Patches,
    PCM, meta (and the effects folder, carried by a pack copy as any other folder);
  * the firmware finds a file by its NN_ prefix alone: a stray NN_something in those folders can be taken instead of the real file (this happened: the
    NN_SC34D.bin files of a diagnostic hid the sessions).  So nothing of ours is ever left in a pack: backups go to a folder outside it;
  * Patches/NN_PATCHBANK.cpb = 8 records of 512 B: 340 of a Nova patch + 172 of padding; the padding of record n is the own-synth patch n;
  * PCM/NN_Name.wav = 64 samples;
  * Sessions/NN_Name.ncs = 160 780 B; MIDI 1 / 2's patterns = 2 x 8 x 3 240 B at 0x1A27C;
  * the 8 CC presets (MIDI templates) are NOT on the card: the device keeps them in its internal memory (_GLOB.cg, volume 0, keys 0x1F + i).  Here they
    are a file of 8 x 120 B, the device's own records, or the device itself over USB.
The device, connected by USB, is one more folder: Device / DevRoot below speak the stock file protocol behind the same calls as a folder handle. */
const SD = (() => {
"use strict";
const REC = 512, PSZ = 340, PADN = 172, PER = 8, BANKS = 16, SLOTS = 128;
const NSAMPLES = 64, NSESS = 64, NPACKS = 31, FOLDER_MAX = 30;
const SYNTH0 = 0x2E4, DRUM0 = 0xCD74, DPAT = 0x6A8, DSETT = 0x80, DLANE0 = 0xA8, DLANES = 8, NPATS = 64, DRUM_NOTE = [60, 62, 64, 65];
const SESS_SIZE = 0x2740C, MIDI0 = 0x1A27C, PAT = 0xCA8, NSTEPS = 32, STEP = 28, UNITS = 6, SETT = 0x380, SETN = 40, LANE0 = 0x3A8, NLANES = 12, MICRO = 6;
const WORDS_MAX = 0x900000;                                 // the stock's loader stops at Y:$E80000: 9 437 184 words from $580000
const TPL = 0x78, NTPL = 8, TPL_HEAD = 0x28, TPL_REC = 10, CC_DEF = [1, 2, 5, 11, 12, 13, 71, 74];
const NAME_AT = 44, NAME_LEN = 16, FM_AT = 100, FM_LEN = 21, VM_AT = 126, VM_TAG = 0xB6, VM_BASE = 0x50;
const FM_DEF = [11, 11, 11, 11, 127, 64, 48, 32, 64, 64, 64, 64, 0, 0, 0, 64];     // fmeng.DEFAULTS2
const CTM_DEF = [0, 0, 0, 0, 0, 0, 127, 0, 0, 0, 40, 0, 0, 60, 63, 0, 0, 0, 0, 50, 0, 0, 0, 0, 0, 0, 0, 0, 0, 50, 64, 0, 0, 0];   // patchtool.DEFAULTS, codes 1..34

const pad2 = n => String(n).padStart(2, "0");
const TRACK_NAME = ["Synth 1", "Synth 2", "MIDI 1", "MIDI 2", "Drum 1", "Drum 2", "Drum 3", "Drum 4"];
const isFF = (b, a, n) => { for (let i = a; i < a + n; i++) if (b[i] !== 0xFF) return false; return true; };
function latin(b, a, n) { let s = ""; for (let i = a; i < a + n; i++) s += String.fromCharCode(b[i]); return s.replace(/[\s\0]+$/, ""); }
const same = (a, b) => a === b || (!!a.pack && a.pack === b.pack && a.sess === b.sess) || (!!a.set && a.set === b.set);

// ---------------------------------------------------------------- the file system
async function entries(dir) {
  const out = [];
  for await (const [name, h] of dir.entries()) out.push([name, h]);
  return out.sort((a, b) => a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : 0);
}
async function subdir(dir, name, create = false) {
  try { return await dir.getDirectoryHandle(name, {create}); }
  catch (e) { if (e.name === "NotFoundError" || e.name === "TypeMismatchError") return null; throw e; }
}
const readHandle = async h => new Uint8Array(await (await h.getFile()).arrayBuffer());
async function writeFile(dir, name, bytes) {
  const w = await (await dir.getFileHandle(name, {create: true})).createWritable();
  try { await w.write(bytes); await w.close(); }
  catch (e) { try { await w.abort(); } catch (_) { /* the write's own error is the one to report */ } throw e; }
}
async function treeInfo(dir) {
  let files = 0, bytes = 0;
  for (const [, h] of await entries(dir)) {
    if (h.kind === "directory") { const t = await treeInfo(h); files += t.files; bytes += t.bytes; }
    else { files++; bytes += (await h.getFile()).size; }
  }
  return {files, bytes};
}
async function copyTree(src, dst, tick) {
  for (const [n, h] of await entries(src)) {
    if (/\.crswap$/i.test(n) || (h.kind === "directory" && dst.accepts && !dst.accepts(n))) continue;     // the browser's temporary file; a folder the device has no type for
    if (h.kind === "directory") await copyTree(h, await dst.getDirectoryHandle(n, {create: true}), tick);
    else { const b = await readHandle(h); await writeFile(dst, n, b); if (tick) tick(n, b.length); }
  }
}
async function sameTree(a, b) {                             // every file of a is in b with its size
  for (const [n, h] of await entries(a)) {
    if (/\.crswap$/i.test(n) || (h.kind === "directory" && b.accepts && !b.accepts(n))) continue;
    if (h.kind === "directory") { const d = await subdir(b, n); if (!d || !await sameTree(h, d)) return false; continue; }
    let f; try { f = await (await b.getFileHandle(n)).getFile(); } catch (_) { return false; }
    if (f.size !== (await h.getFile()).size) return false;
  }
  return true;
}

// ---------------------------------------------------------------- backups: a folder of the user's, outside the packs
class Backup {
  constructor(dir, title) {
    this.dir = dir; this.title = title || dir.name; this.seen = new Set(); this.count = 0;
    const d = new Date(); this.stamp = `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}_${pad2(d.getHours())}${pad2(d.getMinutes())}${pad2(d.getSeconds())}`;
  }
  async folder(parts) { let h = await subdir(this.dir, this.stamp, true); for (const p of parts) h = await subdir(h, p, true); return h; }
  async file(parts, name, bytes) {                          // only the first version of a file in this run: the one that was on the card
    const key = parts.concat(name).join("/");
    if (this.seen.has(key)) return;
    await writeFile(await this.folder(parts), name, bytes); this.seen.add(key); this.count++;
  }
  async tree(src, parts) { await copyTree(src, await this.folder(parts), () => { this.count++; }); }
}

// ---------------------------------------------------------------- the card
class Pack {
  constructor(card, slot, name, folder, dir) { this.card = card; this.slot = slot; this.name = name; this.folder = folder; this.dir = dir; this.drop(); }
  drop() { this._banks = null; this._samples = null; this._sessions = null; this._open = new Map(); this._info = null; this._usage = null; }
}
class Card {
  constructor(root, tracks) { this.root = root; this.tracks = tracks; this.packs = []; }
  static async open(root) {
    const t = await subdir(root, "Tracks"), c = new Card(root, t || root);
    await c.scan();
    if (!c.packs.length && !t) throw new Error("no-packs");
    return c;
  }
  async scan() {
    const keep = new Map(this.packs.map(p => [p.folder, p])), out = [];
    for (const [n, h] of await entries(this.tracks)) {
      const m = /^(\d\d)_(.*)$/.exec(n);
      if (!m || h.kind !== "directory" || +m[1] >= NPACKS) continue;
      if (!(await subdir(h, "Patches") || await subdir(h, "PCM") || await subdir(h, "Sessions"))) continue;
      out.push(keep.get(n) || new Pack(this, +m[1], m[2], n, h));
    }
    this.packs = out;
  }
  async reset() { this.packs = []; await this.scan(); }
  pack(slot) { return this.packs.find(p => p.slot === slot) || null; }
}
function folderName(slot, name) { return (pad2(slot) + "_" + name).slice(0, FOLDER_MAX).replace(/[\s.]+$/, ""); }

async function packInfo(pack) {
  if (pack.dir.device) return null;                         // every pack's folders, one list at a time, is too slow over USB
  if (pack._info) return pack._info;
  const count = async (sub, re) => { const d = await subdir(pack.dir, sub); return d ? (await entries(d)).filter(e => re.test(e[0])).length : 0; };
  return pack._info = {sessions: await count("Sessions", /\.ncs$/i), banks: await count("Patches", /_PATCHBANK\.cpb$/i), samples: await count("PCM", /\.wav$/i)};
}
async function copyPack(pack, card, slot, ctx = {}) {
  if (card.packs.some(p => p.slot === slot)) throw new Error("slot-used");
  const folder = folderName(slot, pack.name), dst = await card.tracks.getDirectoryHandle(folder, {create: true});
  try {
    const all = await treeInfo(pack.dir); let done = 0;
    await copyTree(pack.dir, dst, n => { done++; if (ctx.progress) ctx.progress(n, done, all.files); });
    if (dst.finish) await dst.finish();
    if (!await sameTree(pack.dir, dst)) throw new Error("verify");
  } catch (e) { await card.tracks.removeEntry(folder, {recursive: true}); throw e; }
  await card.scan();
  return card.pack(slot);
}
async function deletePack(pack, ctx = {}) {
  if (ctx.backup) await ctx.backup.tree(pack.dir, [pack.folder]);
  const card = pack.card;
  await card.tracks.removeEntry(pack.folder, {recursive: true});
  await card.scan();
}
async function movePack(pack, card, slot, ctx = {}) {       // the API has no folder rename: a verified copy, then the source goes (no backup needed: the copy is it)
  if (pack.card === card && pack.slot === slot) return pack;
  if (pack.card === card && card.tracks.renameEntry) {      // the device can
    if (card.packs.some(p => p.slot === slot)) throw new Error("slot-used");
    await card.tracks.renameEntry(pack.folder, folderName(slot, pack.name));
    await card.reset();
    return card.pack(slot);
  }
  const out = await copyPack(pack, card, slot, ctx);
  await deletePack(pack, {});
  return out;
}

// ---------------------------------------------------------------- names: what the firmware, the card's FAT and the USB protocol all accept
/* A file or folder name: printable ASCII without the characters FAT refuses (\ / : * ? " < > |), no space or dot at either end (FAT drops a trailing
   one, so the name on the card would not be the name asked), and the whole name, NN_ and extension included, within 30 characters: the device's
   own names stop there, and over USB a name over 31 overwrites the firmware's stack.  The NN_ prefix is the slot and is never typed: every
   reference (sessions to samples and patches, the device to its packs) goes by that number, so a new name changes nothing but the name.
   Names inside a file (Nova patch 16, custom patch 16, CC preset 32): printable ASCII. */
const NAME_RULE = {packs: {file: true, max: FOLDER_MAX - 3}, drums: {file: true, max: 30 - 7}, nova: {max: 16, need: true}, custom: {max: NAME_LEN}, cc: {max: 32}};
const FAT_BAD = /[\\/:*?"<>|]/;
function checkName(kind, raw) {
  const r = NAME_RULE[kind], s = String(raw).trim();
  if (!r) throw new Error("name-kind");
  if (!/^[ -~]*$/.test(s) || (r.file && FAT_BAD.test(s))) throw new Error(r.file ? "name-chars-file" : "name-chars");
  if (r.file && /[ .]$/.test(s)) throw new Error("name-end");
  if (s.length > r.max) throw new Error("name-long");
  if (!s.length && (r.file || r.need)) throw new Error("name-empty");
  return s;
}
const caseOnly = (a, b) => a !== b && a.toLowerCase() === b.toLowerCase();
async function renameHandle(h, to) {                        // the browser's own move when it has one (no data copied); false = not done
  if (typeof h.move !== "function") return false;
  try { await h.move(to); return true; } catch (_) { return false; }
}
async function renamePack(pack, name, ctx = {}) {
  name = checkName("packs", name);
  const card = pack.card, to = folderName(pack.slot, name);
  if (to === pack.folder) return pack;
  if (card.tracks.renameEntry) await card.tracks.renameEntry(pack.folder, to);            // the device: a FatFs rename
  else if (!await renameHandle(pack.dir, to)) {                                            // a folder: a verified copy, then the old one goes
    const all = await treeInfo(pack.dir); let done = 0;
    const copy = async (src, n) => {
      const d = await card.tracks.getDirectoryHandle(n, {create: true});
      try { await copyTree(src, d, f => { done++; if (ctx.progress) ctx.progress(f, done, all.files * (caseOnly(pack.folder, to) ? 2 : 1)); }); if (!await sameTree(src, d)) throw new Error("verify"); }
      catch (e) { await card.tracks.removeEntry(n, {recursive: true}); throw e; }
      return d;
    };
    if (caseOnly(pack.folder, to)) {                        // a case-insensitive file system: the same folder; through a name the device ignores
      const tmp = "_renaming_" + pack.folder, t = await copy(pack.dir, tmp);
      await card.tracks.removeEntry(pack.folder, {recursive: true});
      await copy(t, to); await card.tracks.removeEntry(tmp, {recursive: true});
    } else {
      if (await subdir(card.tracks, to)) throw new Error("name-taken");
      await copy(pack.dir, to); await card.tracks.removeEntry(pack.folder, {recursive: true});
    }
  }
  await card.reset();
  return card.pack(pack.slot);
}
async function renameFile(dir, from, to, ctx = {}, parts = []) {   // one file of a folder; the device renames, the PC moves or copies
  if (from === to) return;
  if (dir.renameEntry) return dir.renameEntry(from, to);
  const h = await dir.getFileHandle(from);
  if (await renameHandle(h, to)) return;
  const b = await readHandle(h);
  if (caseOnly(from, to)) {                                 // the same file: out, then in again (put back if the write fails)
    if (ctx.backup) await ctx.backup.file(parts, from, b);
    await dir.removeEntry(from);
    try { await writeFile(dir, to, b); } catch (e) { await writeFile(dir, from, b); throw e; }
    return;
  }
  await writeFile(dir, to, b);

// ---- the custom patch editor
const opt = (v, text, cur) => `<option value="${v}"${v === cur ? " selected" : ""}>${esc(text)}</option>`;
function field(key, label, min, max, v) { return `<label class="fld"><span title="${esc(label)}">${esc(label)}</span><input type="range" min="${min}" max="${max}" value="${v}" data-k="${key}"><input type="number" min="${min}" max="${max}" value="${v}" data-k="${key}"></label>`; }

async function editCustom(p, n) {
  const pl = p.place(), d = $("ed");

  const draw = () => {
    const k = pad[4] & 1 ? pad[4] & 15 : 0, gran = k === 11, vm = SD.vmGet(pad), lfo = pad[41] >= 2 && pad[42] < 7 ? pad[42] : 0;
    const groups = GROUPS.map(g => `<fieldset><legend>${esc(T(g[1], g[2]))}</legend>${PARAMS.filter(x => x[1] === g[0]).map(x => { const [lo, hi] = range(x[0]); return field("c" + x[0], gran && x[4] ? T(x[4], x[5]) : T(x[2], x[3]), lo, hi, SD.ctmCode(pad, x[0])); }).join("")}</fieldset>`).join("");
    const fmHtml = k === 3 && fm.on ? `<fieldset><legend>FM</legend><label class="fld"><span>${T("Algoritmo", "Algorithm")}</span><select data-k="alg">${ALGS.map((a, i) => opt(i, `${i + 1} ${a}`, fm.params[12])).join("")}</select></label>${fm.params.map((v, i) => FM_LABELS[i] ? field("f" + i, T(FM_LABELS[i][0], FM_LABELS[i][1]), 0, 127, v) : "").join("")}</fieldset>` : "";

      <label>${T("Motor", "Engine")} <select data-k="engine">${ENGINES.map(e => opt(e[0], T(e[1], e[2]), k)).join("")}</select></label>
      ${k === 3 ? `<label><input type="checkbox" data-k="fm"${fm.on ? " checked" : ""}> FM</label>` : ""}
      <label><input type="checkbox" data-k="dual"${pad[4] & 16 ? " checked" : ""}> ${T("Dos osciladores", "Two oscillators")}</label>
      <label><input type="checkbox" data-k="route"${pad[4] & 32 ? " checked" : ""}> ${T("Orden de la cadena", "Chain order")}</label>
      <label>${T("Voz", "Voice")} <select data-k="voice">${opt(-1, T("(la del aparato)", "(the device's)"), vm ? vm.mode : -1)}${VOICE.map(v => opt(v[0], T(v[1], v[2]), vm ? vm.mode : -1)).join("")}</select></label>
      <label>LFO <select data-k="lfo">${LFOS.map((l, i) => opt(i, T(l[0], l[1]), lfo)).join("")}</select></label></div>
      <div class="form">${groups}${fmHtml}</div>
      <p class="dim" style="margin:8px 0 0;font-size:.82rem">${T("La matriz, los destinos de la página 4 y el resto del parche no cambian.", "The matrix, page 4's destinations and the rest of the patch stay as they are.")}</p>
      <div class="btns"><button type="button" data-do="cancel">${T("Cancelar", "Cancel")}</button><button type="button" class="pri" data-do="save">${T("Guardar", "Save")}</button></div>`;

    const t = e.target, k = t.dataset ? t.dataset.k : null;

    else if (k === "fm") { fm.on = t.checked ? 1 : 0; draw(); }

      res();
    };
    d.oncancel = () => { d.innerHTML = ""; res(); };
    d.showModal();
  });
}

    };
    d.oncancel = () => { d.innerHTML = ""; res(); };
    d.showModal();
  });
}
async function ccOpen(p) {
  let h; try { [h] = await window.showOpenFilePicker({types: [{description: "CC presets", accept: {"application/octet-stream": [".ctcc"]}}]}); } catch (_) { return; }
  const b = await SD.readHandle(h);
  if (b.length !== SD.TPL * SD.NTPL) return say(T("Ese fichero no vale", "Not that file"), T(`Un fichero .ctcc tiene ${SD.TPL * SD.NTPL} bytes.`, `A .ctcc file is ${SD.TPL * SD.NTPL} bytes.`));
  p.cc = {bytes: b, title: h.name, handle: h, dirty: false}; p.sel.clear();
  await renderAll();
}
async function ccSave(p) {
  let h = p.cc.handle;
  if (!h) { try { h = await window.showSaveFilePicker({suggestedName: "presets.ctcc", types: [{description: "CC presets", accept: {"application/octet-stream": [".ctcc"]}}]}); } catch (_) { return; } }
  const w = await h.createWritable(); await w.write(p.cc.bytes); await w.close();
  p.cc.handle = h; p.cc.title = h.name; p.cc.dirty = false;
  log(T("Guardado: ", "Saved: ") + h.name, "ok");
  await renderAll();
}
// ---- the device over USB
async function openMidi() {
  if (!navigator.requestMIDIAccess) throw new Error("no-webmidi");
  const a = await navigator.requestMIDIAccess({sysex: true});
  const good = x => /Circuit Tracks/i.test(x.name || "") && !/MIDIIN|MIDIOUT|MIDI 2|MIDI 3|DAW|DIN|Bootloader/i.test(x.name);     // the main port, as Components picks it
  const input = [...a.inputs.values()].find(good), output = [...a.outputs.values()].find(good);
  if (!input || !output) throw new Error("no-device");
  const tx = {onmessage: null, send: b => output.send(b), close: () => { input.onmidimessage = null; }};
  input.onmidimessage = e => { if (e.data[0] === 0xF0 && tx.onmessage) tx.onmessage(e.data); };
  await input.open(); await output.open();
  return tx;
}
async function attach(tx, p) {                              // only here is a session opened, only disconnect() closes it
  const dev = new SD.Device(tx);
  await dev.identify();
  const how = await dev.open();
  const card = await SD.Card.open(new SD.DevRoot(dev));
  card.device = dev; state.dev = {dev, card, tx};
  p.card = card; p.packSlot = card.packs.length ? card.packs[0].slot : null; p.sess = null; p.sel.clear();
  if (!p.other.card) { p.other.card = card; p.other.packSlot = p.packSlot; p.other.sess = null; }
  log(T("Aparato conectado", "Device connected") + (how === "adopted" ? T(" (la sesión ya estaba abierta)", " (the session was already open)") : "") + `: ${card.packs.length} packs`, "ok");
  drawChrome(); await renderAll();
}
async function connectDevice(p) {
  if (state.dev) { p.card = state.dev.card; p.packSlot = p.card.packs.length ? p.card.packs[0].slot : null; p.sess = null; p.sel.clear(); return renderAll(); }
  const c = await ask(T("Conectar el aparato", "Connect the device"), T(`<p>Mientras esté conectado, <b>el transporte se para y el panel queda bloqueado</b> hasta Desconectar.</p><ul>
      <li>Cierra Components: no uses los dos a la vez.</li><li>Guarda el proyecto antes: si escribes en la sesión cargada, al desconectar el aparato la recarga y pierdes lo no guardado.</li>
      <li>Si escribes samples del pack cargado, se recargan todos al desconectar.</li><li>Con el mod, abrir la conexión pisa unos 1,7 s del sample capturado sin guardar.</li></ul>`,
    `<p>While connected, <b>the transport stops and the panel is locked</b> until Disconnect.</p><ul>
      <li>Close Components: do not use both at once.</li><li>Save the project first: if you write the loaded session, the device reloads it on disconnect and unsaved edits are lost.</li>
      <li>If you write samples of the loaded pack, all of them reload on disconnect.</li><li>With the mod, connecting overwrites about 1.7 s of an unsaved captured sample.</li></ul>`), [[T("Conectar", "Connect"), true, "pri"], [T("Cancelar", "Cancel"), false]]);
  if (!c) return;
  let tx = null;
  try { tx = await openMidi(); await attach(tx, p); }
  catch (e) { if (tx) tx.close(); state.dev = null; log(errText(e), "bad"); await say(T("No se ha podido conectar", "Could not connect"), esc(errText(e))); }
}
async function disconnect() {
  const d = state.dev;
  if (!d || state.busy) return;
  state.busy = true; log(T("Desconectando: el aparato puede tardar si recarga algo …", "Disconnecting: the device may take a while if it reloads something …"));
  try { await d.dev.close(); log(T("Aparato desconectado", "Device disconnected"), "ok"); }
  catch (e) { log(errText(e), "bad"); }
  d.tx.close(); state.dev = null; state.busy = false;
  for (const p of panes) if (p.card === d.card) { p.card = null; p.packSlot = null; p.sess = null; p.sel.clear(); }
  drawChrome(); await renderAll();
}
async function loadedOK(pack) {                             // a write in the pack the device has loaded takes effect when the session closes
  const d = pack && pack.card.device;
  if (!d || d.loaded !== pack.slot + 1 || state.dev.warned) return true;
  const c = await ask(T("Es el pack cargado", "It is the loaded pack"), T("Al desconectar, el aparato recargará lo que cambie aquí: los samples, y la sesión cargada si la tocas (se pierde lo no guardado).", "On disconnect the device reloads what changes here: the samples, and the loaded session if you touch it (unsaved edits are lost)."), [[T("Seguir", "Go on"), true, "dng"], [T("Cancelar", "Cancel"), false]]);
  if (c) state.dev.warned = true;
  return c;
}
async function noSession(fn) {                              // the CC messages go outside a file session, as Components sends them
  const dev = state.dev.dev, was = dev.sess;
  if (was) await dev.close();
  try { await fn(dev); } finally { if (was) await dev.open(); }
}
async function ccGet(p) {
  await run(T("Leer presets del aparato", "Read presets from the device"), ctx => noSession(async dev => {
    for (let n = 0; n < SD.NTPL; n++) { p.cc.bytes.set(await dev.ccRead(n), SD.TPL * n); ctx.progress("", n + 1, SD.NTPL); }
    p.cc.title = "Circuit Tracks"; p.cc.handle = null; p.cc.dirty = false;
  }));
}
async function ccPut(p) {
  const from = p.sel.size ? [...p.sel].sort((a, b) => a - b) : p.items.map(x => x.slot);
  if (!await ask(T("Enviar al aparato", "Send to the device"), T("Se sustituyen estos presets en la memoria del aparato:", "These presets are replaced in the device's memory:") + nameList(from.map(n => itemName("cc", p.items[n]))), [[T("Enviar", "Send"), true, "dng"], [T("Cancelar", "Cancel"), false]])) return;
  await run(T("Enviar presets al aparato", "Send presets to the device"), ctx => noSession(async dev => {
    for (let i = 0; i < from.length; i++) {
      const n = from[i], t = p.cc.bytes.subarray(SD.TPL * n, SD.TPL * (n + 1));
      await dev.ccWrite(n, t);
      const back = await dev.ccRead(n);                     // what the stock kept: a knob type it does not take shows here
      if (back.some((b, j) => j >= 4 && b !== t[j])) log(T(`Preset ${n + 1}: el aparato no guarda todo igual.`, `Preset ${n + 1}: the device does not keep it all alike.`), "warn");
      ctx.progress("", i + 1, from.length);
    }
  }));
}
const stamp = () => { const d = new Date(), z = n => SD.pad2(n); return `${d.getFullYear()}-${z(d.getMonth() + 1)}-${z(d.getDate())}_${z(d.getHours())}${z(d.getMinutes())}${z(d.getSeconds())}`; };
async function snapTo(top, ctx) {
  const t0 = Date.now(), cc = new Uint8Array(SD.TPL * SD.NTPL);
  await noSession(async dev => { for (let n = 0; n < SD.NTPL; n++) cc.set(await dev.ccRead(n), SD.TPL * n); });
  await SD.writeFile(top, "presets.ctcc", cc);
  const r = await SD.snapshot(state.dev.card, top, ctx);
  log(`${r.files} ${T("ficheros", "files")}, ${mb(r.bytes)}, ${Math.round((Date.now() - t0) / 1000)} s`);
}
async function snapAct() {
  if (state.busy || !state.dev) return;
  let h; try { h = await window.showDirectoryPicker({id: "sdsnap", mode: "readwrite"}); } catch (_) { return; }
  for (const p of panes) if (p.card && !p.card.device && await p.card.root.resolve(h)) return say(T("Esa carpeta no vale", "Not that folder"), T("El snapshot debe quedar fuera de la tarjeta.", "The snapshot must stay off the card."));
  const name = "Circuit_" + stamp();
  if (!await ask(T("Snapshot del aparato", "Snapshot of the device"), T(`<p>Se copian a <b>${esc(h.name)}/${name}</b> todos los packs de la tarjeta, el pack interno y los presets de CC. Puede tardar mucho.</p><p>No entran: los ajustes del aparato ni lo que no hayas guardado del proyecto.</p>`, `<p>All the card's packs, the internal pack and the CC presets are copied to <b>${esc(h.name)}/${name}</b>. It can take a long time.</p><p>Left out: the device's settings and whatever is unsaved in the project.</p>`), [[T("Copiar", "Copy"), true, "pri"], [T("Cancelar", "Cancel"), false]])) return;
  await run(T("Snapshot", "Snapshot"), async ctx => snapTo(await SD.subdir(h, name, true), ctx));
}
async function restoreFrom(top, ctx, confirm) {             // nothing changes until confirm has seen the plan
  const d = state.dev, plan = await SD.restorePlan(d.card, top, ctx);
  let want = null, cc = [];
  try { want = await SD.readHandle(await top.getFileHandle("presets.ctcc")); } catch (_) { /* a snapshot without presets: they stay */ }
  if (want && want.length === SD.TPL * SD.NTPL) await noSession(async dev => {
    for (let n = 0; n < SD.NTPL; n++) { const b = await dev.ccRead(n); if (b.some((x, j) => j >= 4 && x !== want[SD.TPL * n + j])) cc.push(n); }
  });
  if (!plan.write.length && !plan.del.length && !cc.length) { log(T("El aparato ya es igual que el snapshot.", "The device already matches the snapshot."), "ok"); return plan; }
  if (!await confirm(plan, cc)) { await d.card.reset(); return plan; }
  await SD.restoreApply(d.card, plan, ctx);
  if (cc.length) await noSession(async dev => { for (const n of cc) await dev.ccWrite(n, want.subarray(SD.TPL * n, SD.TPL * (n + 1))); });
  return plan;
}
async function restAct() {
  if (state.busy || !state.dev) return;
  let top; try { top = await window.showDirectoryPicker({id: "sdsnap", mode: "read"}); } catch (_) { return; }
  if (!await ready(state.dev.card)) return;
  await run(T("Restaurar snapshot", "Restore snapshot"), ctx => restoreFrom(top, ctx, (plan, cc) => {
    const loaded = plan.write.some(w => w.P === state.dev.dev.loaded);
    return ask(T("Restaurar en el aparato", "Restore to the device"), T(`<p><b>${plan.write.length}</b> ficheros que escribir (${mb(plan.bytes)}), <b>${plan.del.length}</b> que borrar, ${plan.same} ya iguales, ${cc.length} presets de CC. Las versiones actuales van a tu carpeta de copias.</p>`, `<p><b>${plan.write.length}</b> files to write (${mb(plan.bytes)}), <b>${plan.del.length}</b> to delete, ${plan.same} already equal, ${cc.length} CC presets. The current versions go to your backups folder.</p>`) +
      (plan.replaced.length ? `<p>${T("Packs que se sustituyen:", "Packs replaced:")}</p>${nameList(plan.replaced)}` : "") +
      (plan.keep.length ? `<p>${T("Packs que no están en el snapshot y se quedan:", "Packs not in the snapshot, which stay:")}</p>${nameList(plan.keep)}` : "") +
      (loaded ? `<p>${T("Incluye el pack cargado: al desconectar se recarga y se pierde lo no guardado.", "It includes the loaded pack: it reloads on disconnect and unsaved edits are lost.")}</p>` : ""),
      [[T("Restaurar", "Restore"), true, "dng"], [T("Cancelar", "Cancel"), false]]);
  }));
}
const fileSafe = s => String(s).replace(/[<>:"/\\|?*\x00-\x1f]/g, "_").replace(/[\s.]+$/, "") || "_";
const EXPORTS = {
  nova: ["Novation patch", ".syx"], custom: ["CIRCUIT-HACKS patch", ".ctm"], drums: ["WAV", ".wav"], patterns: ["MIDI", ".mid"],
};
async function exportFiles(p, n, it, ext) {                 // -> [[file name, bytes]]
  const pl = p.place(), tab = state.tab;
  if (tab === "nova") { const b = await SD.Nova.get(pl, n); return [[`${SD.pad2(n)}_${fileSafe(it.name)}.syx`, Uint8Array.from([0xF0, 0, 0x20, 0x29, 1, 0x64, 0, 0, 0, ...b.subarray(0, SD.PSZ), 0xF7])]]; }
  if (tab === "custom") return [[`${SD.pad2(n)}_${fileSafe(it.name || "patch")}.ctm`, await SD.Custom.get(pl, n)]];
  if (tab === "drums") { const x = await SD.Drums.get(pl, n); return [[`${SD.pad2(n)}_${fileSafe(x.name)}.wav`, x.bytes]]; }
  const b = await SD.Patterns.get(pl, n), s = (await SD.sessionsOf(pl.pack)).get(pl.sess), base = fileSafe(`${s.label} ${TRACKS[n >> 3]} P${(n & 7) + 1}`), d = pl.pack.card.device;
  const ch = d && d.chans ? d.chans[Math.min(4, n >> 3)] : [0, 1, 2, 3, 9][Math.min(4, n >> 3)], out = [];
  if (ext !== ".ctpat") out.push([base + ".mid", SD.patMidi(b, n, ch)]);
  if (ext !== ".mid") out.push([base + ".ctpat", b]);
  return out;
}
async function ccExport(p) {
  let h; try { h = await window.showSaveFilePicker({id: "sdexport", suggestedName: "presets.ctcc", types: [{description: "CC presets", accept: {"application/octet-stream": [".ctcc"]}}]}); } catch (_) { return; }
  await run(T("Exportar presets", "Export presets"), async ctx => {
    if (state.dev) await noSession(async dev => {           // what the device holds, not what the tab shows
      for (let n = 0; n < SD.NTPL; n++) { p.cc.bytes.set(await dev.ccRead(n), SD.TPL * n); ctx.progress("", n + 1, SD.NTPL); }
      p.cc.title = "Circuit Tracks"; p.cc.handle = null; p.cc.dirty = false;
    });
    const w = await h.createWritable(); await w.write(p.cc.bytes); await w.close();
  });
}
async function exportAct(p) {
  const tab = state.tab;
  if (tab === "cc") return ccExport(p);
  if (!p.card) return say(T("Nada abierto", "Nothing open"), T("Conecta el aparato o abre una carpeta.", "Connect the device or open a folder."));
  const rows = p.sel.size ? selected(p) : tab === "packs" ? [] : shown(p, p.items).filter(it => !it.empty).map(it => it.slot);
  if (!rows.length) return say(T("Nada elegido", "Nothing chosen"), tab === "packs" ? T("Elige uno o varios packs.", "Choose one or more packs.") : T("No hay nada que exportar aquí.", "Nothing to export here."));
  const one = rows.length === 1 && tab !== "packs";
  let h, dir;
  try {                                                     // the dialogs want this click: they go before anything slow
    if (one) {
      const kind = EXPORTS[tab], it = p.items[rows[0]], types = [{description: kind[0], accept: {"application/octet-stream": [kind[1]]}}];
      if (tab === "patterns") types.push({description: "CIRCUIT-HACKS pattern", accept: {"application/octet-stream": [".ctpat"]}});
      h = await window.showSaveFilePicker({id: "sdexport", suggestedName: fileSafe(tab === "patterns" ? `${TRACKS[it.slot >> 3]} P${(it.slot & 7) + 1}` : `${SD.pad2(it.slot)}_${it.name || "patch"}`) + kind[1], types});
    } else dir = await window.showDirectoryPicker({id: "sdexport", mode: "readwrite"});
  } catch (_) { return; }
  for (const q of panes) if (dir && q.card && !q.card.device && await q.card.root.resolve(dir)) return say(T("Esa carpeta no vale", "Not that folder"), T("Exporta fuera de la tarjeta: el aparato busca los ficheros por su prefijo NN_.", "Export off the card: the device finds files by their NN_ prefix."));
  await run(`${T("Exportar", "Export")} ${rows.length}`, async ctx => {
    if (tab === "packs") {
      const packs = rows.map(n => p.card.pack(n));
      let all = 0, files = 0, done = 0;
      for (const x of packs) { const i = await SD.treeInfo(x.dir); all += i.bytes; files += i.files; }
      ctx.total(all);
      const local = !p.card.device;
      for (const x of packs) await SD.copyTree(x.dir, await SD.subdir(dir, x.folder, true), (n, size) => { if (local) ctx.add(size); ctx.progress(n, ++done, files); });
      return;
    }
    if (tab === "drums") ctx.total(rows.reduce((a, n) => a + p.items[n].size, 0));
    const ext = h ? h.name.slice(h.name.lastIndexOf(".")).toLowerCase() : null;
    for (let i = 0; i < rows.length; i++) {
      const n = rows[i], files = await exportFiles(p, n, p.items[n], ext);
      if (h) { const w = await h.createWritable(); await w.write(files[0][1]); await w.close(); }
      else for (const [name, bytes] of files) await SD.writeFile(dir, name, bytes);
      if (tab === "drums" && !p.card.device) ctx.add(p.items[n].size);
      ctx.progress(files[0][0], i + 1, rows.length);
    }
  });
}
async function editAct(p) {
  const n = p.sel.size ? Math.min(...p.sel) : null;
  if (n === null) return say(T("Nada elegido", "Nothing chosen"), T("Elige una fila.", "Choose a row."));
  if (state.tab === "custom") return editCustom(p, n);
  if (state.tab === "patterns") return editPattern(p, n);
  if (state.tab === "cc") return editCC(p, n);
}

// ---- events
for (const p of panes) {
  p.el.addEventListener("click", async e => {
    if (state.busy) return;
    const t = e.target, act = t.dataset ? t.dataset.act : null;
    if (t.dataset && t.dataset.play !== undefined) { play(p, +t.dataset.play, t); return; }
    if (act === "open") return openFolder(p);
    if (act === "device") return connectDevice(p);
    if (act === "ccget") return ccGet(p);
    if (act === "ccput") return ccPut(p);
    if (act === "usage") { const pack = p.pack; if (pack) await run(T("Uso en proyectos", "Use in projects"), ctx => SD.usageOf(pack, ctx), true); return; }
    if (act === "reload") { if (p.card) { await p.card.reset(); for (const q of panes) if (q.card === p.card) q.sel.clear(); await renderAll(); } return; }
    if (act === "copy") return transferAct(p, false);
    if (act === "move") return transferAct(p, true);
    if (act === "del") return deleteAct(p);
    if (act === "rename") return renameAct(p);
    if (act === "export") return exportAct(p);
    if (act === "edit") return editAct(p);
    if (act === "ccopen") return ccOpen(p);
    if (act === "ccsave") return ccSave(p);
    if (act === "ccnew") { p.cc = {bytes: SD.ccDefault(), title: null, handle: null, dirty: false}; p.sel.clear(); return renderAll(); }
    if (act === "issues") {
      const why = i => i.why === "stray" ? T("no es un fichero del pack", "not a file of the pack") : T("mismo número que ", "same number as ") + i.with;
      return say(T("Ficheros que pueden tapar a los del pack", "Files that can hide the pack's own"), T("<p>El aparato busca por el prefijo NN_: estos ficheros pueden ocupar el lugar del fichero real. Quítalos desde el PC.</p>", "<p>The device looks files up by their NN_ prefix: these can take the real file's place. Remove them from the PC.</p>") + nameList(p.issues.map(i => `${i.file} (${why(i)})`), 30));
    }
    const row = t.closest(".row");
    if (row) clickRow(p, +row.dataset.n, e);
  });
  p.el.addEventListener("dblclick", e => {
    if (state.busy) return;
    const row = e.target.closest(".row"); if (!row) return;
    const n = +row.dataset.n; p.sel = new Set([n]); paint(p);
    if (state.tab === "drums") { if (!p.items[n].empty) play(p, n, row.querySelector(".play")); }
    else if (state.tab === "custom" || state.tab === "patterns" || state.tab === "cc") editAct(p);
  });
  p.el.addEventListener("change", async e => {
    const t = e.target, w = t.dataset ? t.dataset.sel : null;
    if (w === "pack") { p.packSlot = +t.value; p.sess = null; p.sel.clear(); stopAudio(); await render(p); }
    else if (w === "sess") { p.sess = +t.value; p.sel.clear(); await render(p); }
    else if (w === "track") { p.track = +t.value; p.sel.clear(); await render(p); }
    else return;
    paint(p.other);
  });
}
function drawChrome() {
  document.documentElement.lang = LANG;
  $("sub").textContent = T("Packs, sintes, drums, parches y patrones de la tarjeta microSD", "Packs, synths, drums, patches and patterns of the microSD card");
  $("tabs").innerHTML = TABS.map(t => `<button type="button" role="tab" data-tab="${t[0]}">${esc(T(t[1], t[2]))}</button>`).join("");
  for (const b of document.querySelectorAll(".lang button")) b.classList.toggle("on", b.dataset.lang === LANG);
  $("notice").textContent = state.dev ? T("Aparato conectado: transporte parado y panel bloqueado hasta Desconectar.", "Device connected: transport stopped and panel locked until Disconnect.")
    : window.showDirectoryPicker ? "" : T("Este navegador no puede abrir carpetas: usa Chrome o Edge en un ordenador.", "This browser cannot open folders: use Chrome or Edge on a computer.");
  $("bDev").hidden = !state.dev; $("bDev").textContent = T("Desconectar aparato", "Disconnect device");
  $("bSnap").hidden = $("bRest").hidden = !state.dev; $("bSnap").textContent = T("Snapshot…", "Snapshot…"); $("bRest").textContent = T("Restaurar…", "Restore…");
  paintBackup();
}
$("tabs").addEventListener("click", async e => {
  const t = e.target.dataset ? e.target.dataset.tab : null;
  if (!t || state.busy || t === state.tab) return;
  stopAudio(); state.tab = t; for (const p of panes) p.sel.clear();
  await renderAll();
});
document.querySelector(".lang").addEventListener("click", async e => {
  const l = e.target.dataset ? e.target.dataset.lang : null;
  if (!l || l === LANG) return;
  LANG = l; try { localStorage.setItem("sdapp.lang", l); } catch (_) { /* no storage: this page only */ }
  drawChrome(); await renderAll();
});
$("bBackup").addEventListener("click", pickBackup);
$("bDev").addEventListener("click", disconnect);
$("bSnap").addEventListener("click", snapAct);
$("bRest").addEventListener("click", restAct);
window.addEventListener("pagehide", () => { if (state.dev) state.dev.dev.closeNow(); });   // an abandoned session keeps the panel locked
drawChrome();
renderAll();
window.SDAPP = {state, panes, openRoot, renderAll, attach, disconnect, snapTo, restoreFrom, setBackup: dir => { state.backup = dir ? new SD.Backup(dir) : null; state.noBackup = !dir; paintBackup(); }};
})();
</script>
