" fill-opacity="0.35" stroke="#000"/><rect x="146" y="340" width="54" height="54" rx="7" fill="#ffffff" fill-opacity="0.35" stroke="#000"/><rect x="332" y="340" width="54" height="54" rx="7" fill="#ffffff" fill-opacity="0.35" stroke="#000"/><rect x="394" y="340" width="54" height="54" rx="7" fill="#ffffff" fill-opacity="0.35" stroke="#000"/><rect x="456" y="340" width="54" height="54" rx="7" fill="#ffffff" fill-opacity="0.35" stroke="#000"/><rect x="84" y="402" width="54" height="54" rx="7" fill="#ffffff" fill-opacity="0.95" stroke="#000"/><text x="111" y="428" class="pl" fill="#111">Tónica</text><rect x="208" y="402" width="54" height="54" rx="7" fill="#ffffff" fill-opacity="0.35" stroke="#000"/><rect x="394" y="402" width="54" height="54" rx="7" fill="#ffffff" fill-opacity="0.35" stroke="#000"/><rect x="456" y="402" width="54" height="54" rx="7" fill="#ffffff" fill-opacity="0.35" stroke="#000"/><rect x="518" y="402" width="54" height="54" rx="7" fill="#ffffff" fill-opacity="0.35" stroke="#000"/><g class="g0"><rect x="208" y="340" width="54" height="54" rx="7" fill="#ffffff" fill-opacity="0.35" stroke="#000"/></g><g class="g1"><rect x="146" y="402" width="54" height="54" rx="7" fill="#ffffff" fill-opacity="0.35" stroke="#000"/></g><g class="g2"><rect x="270" y="402" width="54" height="54" rx="7" fill="#ffffff" fill-opacity="0.35" stroke="#000"/></g><g class="g3"><rect x="332" y="402" width="54" height="54" rx="7" fill="#ffffff" fill-opacity="0.35" stroke="#000"/></g><g class="g4"><rect x="146" y="402" width="54" height="54" rx="7" fill="#1a47ff" fill-opacity="0.95" stroke="#000"/><text x="173" y="428" class="pl" fill="#e8eaed">Periodo</text></g><g class="g5"><rect x="146" y="402" width="54" height="54" rx="7" fill="#00ff00" fill-opacity="0.95" stroke="#000"/></g><g class="g6"><rect x="270" y="402" width="54" height="54" rx="7" fill="#1a47ff" fill-opacity="0.95" stroke="#000"/><text x="297" y="428" class="pl" fill="#e8eaed">Periodo</text></g><g class="g7"><rect x="208" y="340" width="54" height="54" rx="7" fill="#00ff00" fill-opacity="0.95" stroke="#000"/></g><g class="g8"><rect x="270" y="402" width="54" height="54" rx="7" fill="#00ff00" fill-opacity="0.95" stroke="#000"/><rect x="332" y="402" width="54" height="54" rx="7" fill="#1a47ff" fill-opacity="0.95" stroke="#000"/><text x="359" y="428" class="pl" fill="#e8eaed">Periodo</text></g><text x="88" y="266" class="pn">1</text><text x="150" y="266" class="pn">2</text><text x="212" y="266" class="pn">3</text><text x="274" y="266" class="pn">4</text><text x="336" y="266" class="pn">5</text><text x="398" y="266" class="pn">6</text><text x="460" y="266" class="pn">7</text><text x="522" y="266" class="pn">8</text><text x="88" y="328" class="pn">9</text><text x="150" y="328" class="pn">10</text><text x="212" y="328" class="pn">11</text><text x="274" y="328" class="pn">12</text><text x="336" y="328" class="pn">13</text><text x="398" y="328" class="pn">14</text><text x="460" y="328" class="pn">15</text><text x="522" y="328" class="pn">16</text><text x="88" y="390" class="pn">17</text><text x="150" y="390" class="pn">18</text><text x="212" y="390" class="pn">19</text><text x="274" y="390" class="pn">20</text><text x="336" y="390" class="pn">21</text><text x="398" y="390" class="pn">22</text><text x="460" y="390" class="pn">23</text><text x="522" y="390" class="pn">24</text><text x="88" y="452" class="pn">25</text><text x="150" y="452" class="pn">26</text><text x="212" y="452" class="pn">27</text><text x="274" y="452" class="pn">28</text><text x="336" y="452" class="pn">29</text><text x="398" y="452" class="pn">30</text><text x="460" y="452" class="pn">31</text><text x="522" y="452" class="pn">32</text><g class="g1"><rect x="34" y="140" width="60" height="18" rx="4" fill="#ffff19" stroke="#111"/><text x="64" y="152.5" class="bt" fill="#111">Scales</text></g><g class="g9"><rect x="34" y="140" width="60" height="18" rx="4" fill="#ffffff" stroke="#111"/><text x="64" y="152.5" class="bt" fill="#111">Scales</text></g><text x="580" y="44" class="vw">Scales</text><g class="g1"><rect x="559" y="137" width="66" height="24" rx="6" class="fo"/><circle cx="622" cy="158" r="5" class="fg"/></g><g class="g10"><rect x="31" y="137" width="66" height="24" rx="6" class="fo"/><circle cx="94" cy="158" r="5" class="fg"/></g><g class="g4"><circle cx="187" cy="443" r="9" class="fg"/></g><g class="g11"><circle cx="311" cy="443" r="9" class="fg"/></g><g class="g12"><circle cx="249" cy="381" r="9" class="fg"/></g><g class="g13"><circle cx="373" cy="443" r="9" class="fg"/></g><rect x="12" y="474" width="632" height="102" rx="10" fill="#222428" stroke="#3a3d42"/><text x="24" y="495" class="ti">Hacer una escala propia · desde RC2</text><g class="g1"><circle cx="40" cy="522" r="17" fill="#ff6a13"/><text x="40" y="526.5" class="sn">1/6</text><text x="68" y="518" class="cp">Shift + Scales (Scales se ve amarillo con Shift pulsado): el editor de la escala</text><text x="68" y="535" class="cp">propia: dos octavas de piano desde la tónica (blanca). Fila 4 = las teclas blancas</text><text x="68" y="552" class="cp">de la primera octava, fila 3 sus negras; filas 2 / 1 la segunda octava. Teclas</text><text x="68" y="569" class="cp">libres, tenues.</text></g><g class="g4"><circle cx="40" cy="522" r="17" fill="#ff6a13"/><text x="40" y="526.5" class="sn">2/6</text><text x="68" y="518" class="cp">Pulsa una tecla para añadirla (pad 26, +2): la tecla más alta pulsada es el periodo</text><text x="68" y="535" class="cp">(azul): la tónica de la siguiente iteración, que no tiene por qué ser la octava.</text></g><g class="g11"><circle cx="40" cy="522" r="17" fill="#ff6a13"/><text x="40" y="526.5" class="sn">3/6</text><text x="68" y="518" class="cp">Otra más arriba (pad 28, +5): pasa a ser el periodo y la anterior queda como nota de</text><text x="68" y="535" class="cp">la escala (verde).</text></g><g class="g12"><circle cx="40" cy="522" r="17" fill="#ff6a13"/><text x="40" y="526.5" class="sn">4/6</text><text x="68" y="518" class="cp">Una tecla por debajo del periodo (pad 19, +3) es una nota más. Pulsar una tecla otra</text><text x="68" y="535" class="cp">vez la quita; hasta 7.</text></g><g class="g13"><circle cx="40" cy="522" r="17" fill="#ff6a13"/><text x="40" y="526.5" class="sn">5/6</text><text x="68" y="518" class="cp">+7 (pad 29) como periodo: una escala de tónica, +2, +3, +5 que se repite cada 7</text><text x="68" y="535" class="cp">semitonos.</text></g><g class="g14"><circle cx="40" cy="522" r="17" fill="#ff6a13"/><text x="40" y="526.5" class="sn">6/6</text><text x="68" y="518" class="cp">En las pistas de notas cada fila de pads es una iteración (con 4 notas o menos, dos</text><text x="68" y="535" class="cp">por fila); también la usan el cuantizado y el random-mutate. Se guarda con el</text><text x="68" y="552" class="cp">proyecto; una escala de stock (pads 17-32 fuera del editor) la apaga.</text></g></svg>
