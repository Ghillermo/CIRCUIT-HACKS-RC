cy="257" r="9" class="fg"/></g><g class="g8"><path d="M265.8 32A28 28 0 0 1 314.2 32" class="ta"/><path d="M317.7 38.1L310.4 34.2L318.1 29.8z" fill="#ff6a13"/></g><g class="g4"><rect x="295" y="137" width="66" height="24" rx="6" class="fo"/><circle cx="358" cy="158" r="5" class="fg"/></g><rect x="12" y="474" width="632" height="102" rx="10" fill="#222428" stroke="#3a3d42"/><text x="24" y="495" class="ti">Send a mod matrix source to a destination · since RC2.02</text><g class="g7"><circle cx="40" cy="522" r="17" fill="#ff6a13"/><text x="40" y="526.5" class="sn">1/5</text><text x="68" y="518" class="cp">MIDI 1, Preset, with the engine on: pad 6 (light blue) = the mod matrix: the 8 knobs</text><text x="68" y="535" class="cp">are 8 sources: velocity, note, random, LFO 2, envelope 2, a drum hit, the pattern</text><text x="68" y="552" class="cp">position and stepped random.</text></g><g class="g9"><circle cx="40" cy="522" r="17" fill="#ff6a13"/><text x="40" y="526.5" class="sn">2/5</text><text x="68" y="518" class="cp">Turn a source to the right (K4, LFO 2): its position is the destination and the</text><text x="68" y="535" class="cp">amount. While it turns, the pads show where the destination lives: its page (pad 1,</text><text x="68" y="552" class="cp">VCA-VCF) and its knob on pads 9-16 (bright: K5, the filter).</text></g><g class="g6"><circle cx="40" cy="522" r="17" fill="#ff6a13"/><text x="40" y="526.5" class="sn">3/5</text><text x="68" y="518" class="cp">Further right the amount grows: the LED brighter, in the colour of the destination's</text><text x="68" y="535" class="cp">page (amber = page 1).</text></g><g class="g3"><circle cx="40" cy="522" r="17" fill="#ff6a13"/><text x="40" y="526.5" class="sn">4/5</text><text x="68" y="518" class="cp">Then comes the next destination (pad 14, the resonance) and the amount starts again:</text><text x="68" y="535" class="cp">two clicks a step, 16 steps a destination, 33 destinations.</text></g><g class="g4"><circle cx="40" cy="522" r="17" fill="#ff6a13"/><text x="40" y="526.5" class="sn">5/5</text><text x="68" y="518" class="cp">Clear + knob = that source off; Clear + pad 6 = all off; Shift + K4 = LFO 2's shape</text><text x="68" y="535" class="cp">and rate. Saved with the own-synth patches and, since RC4, with the project.</text></g></svg>
