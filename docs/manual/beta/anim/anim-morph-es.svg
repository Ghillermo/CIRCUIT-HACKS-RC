height="28" rx="4" fill="#c63ac6" stroke="#111"/><text x="111" y="189.5" class="bt" fill="#111">Synth 1</text><g class="g0"><rect x="22" y="172" width="54" height="28" rx="4" fill="#c63ac6" stroke="#111"/><text x="49" y="189.5" class="bt" fill="#111">Preset</text></g><g class="g4"><circle cx="146" cy="96" r="21" fill="none" stroke="#ffff19" stroke-width="4"/><text x="146" y="130" class="kl">Posición</text></g><g class="g2"><text x="194" y="20" class="kl">Cuadrado</text><text x="242" y="130" class="kl">Vel. LFO</text><text x="290" y="20" class="kl">Azar</text><text x="386" y="20" class="kl">Duración</text><text x="434" y="130" class="kl">Env</text><text x="482" y="20" class="kl">Tiempo</text></g><g class="g5"><text x="338" y="130" class="kl">Lento →</text></g><g class="g6"><circle cx="338" cy="96" r="21" fill="none" stroke="#00ff00" stroke-width="4"/><text x="338" y="130" class="kl">Lento →</text></g><g class="g7"><circle cx="146" cy="96" r="21" fill="none" stroke="#00ff00" stroke-width="4"/><text x="146" y="130" class="kl">Posición</text></g><g class="g0"><text x="580" y="44" class="vw">Preset de Synth 1</text></g><g class="g2"><text x="580" y="44" class="vw">Morph</text></g><g class="g8"><circle cx="187" cy="257" r="9" class="fg"/><circle cx="373" cy="257" r="9" class="fg"/><circle cx="249" cy="319" r="9" class="fg"/></g><g class="g5"><path d="M121.8 82A28 28 0 0 1 170.2 82" class="ta"/><path d="M173.7 88.1L166.4 84.2L174.1 79.8z" fill="#ff6a13"/></g><g class="g9"><path d="M313.8 82A28 28 0 0 1 362.2 82" class="ta"/><path d="M365.7 88.1L358.4 84.2L366.1 79.8z" fill="#ff6a13"/></g><g class="g3"><circle cx="125" cy="257" r="9" class="fg"/></g><g class="g10"><circle cx="559" cy="443" r="9" class="fg"/></g><g class="g11"><rect x="19" y="169" width="60" height="34" rx="6" class="fo"/><circle cx="76" cy="200" r="5" class="fg"/></g><rect x="12" y="474" width="632" height="102" rx="10" fill="#222428" stroke="#3a3d42"/><text x="24" y="495" class="ti">Hacer morph entre patches · solo Alpha 7.52</text><g class="g8"><circle cx="40" cy="522" r="17" fill="#ff6a13"/><text x="40" y="526.5" class="sn">1/6</text><text x="68" y="518" class="cp">La vista Preset de Synth 1: mantén de dos a cuatro patches (aquí los pads 2, 5 y 11)</text><text x="68" y="535" class="cp">0,4 s …</text></g><g class="g5"><circle cx="40" cy="522" r="17" fill="#ff6a13"/><text x="40" y="526.5" class="sn">2/6</text><text x="68" y="518" class="cp">… se abre la vista del morph: K1 = la posición en la cadena, en el color del patch</text><text x="68" y="535" class="cp">(1 rojo, 2 amarillo, 3 verde, 4 azul); K2 LFO cuadrado, K3 velocidad de los LFO, K4</text><text x="68" y="552" class="cp">LFO de pasos al azar.</text></g><g class="g9"><circle cx="40" cy="522" r="17" fill="#ff6a13"/><text x="40" y="526.5" class="sn">3/6</text><text x="68" y="518" class="cp">K5 = el destino del morph lento, K6 su duración (al momento … 32 compases): gira K5</text><text x="68" y="535" class="cp">y déjalo quieto medio segundo: el sonido va de K1 a K5, y al llegar K1 toma el valor</text><text x="68" y="552" class="cp">de K5.</text></g><g class="g3"><circle cx="40" cy="522" r="17" fill="#ff6a13"/><text x="40" y="526.5" class="sn">4/6</text><text x="68" y="518" class="cp">K7 / K8 = la envolvente (cantidad / tiempo); los pads 1 / 8 la disparan, sostenida</text><text x="68" y="535" class="cp">mientras los mantienes (brillantes mientras corre). Clear + knob = 0; Clear + el</text><text x="68" y="552" class="cp">botón de la pista = todos a 0.</text></g><g class="g10"><circle cx="40" cy="522" r="17" fill="#ff6a13"/><text x="40" y="526.5" class="sn">5/6</text><text x="68" y="518" class="cp">Pad 32 (rojo) = salir. El morph sigue en las otras vistas; el botón de la pista</text><text x="68" y="535" class="cp">vuelve a su vista. Un morph a la vez; no se guarda nada.</text></g><g class="g11"><circle cx="40" cy="522" r="17" fill="#ff6a13"/><text x="40" y="526.5" class="sn">6/6</text><text x="68" y="518" class="cp">Preset = los patches, los de la cadena en blanco: un toque carga ese patch y sale;</text><text x="68" y="535" class="cp">mantener patches 0,4 s = una cadena nueva.</text></g></svg>
