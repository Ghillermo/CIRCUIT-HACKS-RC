" fill-opacity="0.95" stroke="#000"/></g><g class="g6"><rect x="518" y="402" width="54" height="54" rx="7" fill="#00ffb5" fill-opacity="0.35" stroke="#000"/><text x="545" y="428" class="pl" fill="#e8eaed">Macros</text></g><text x="88" y="266" class="pn">1</text><text x="150" y="266" class="pn">2</text><text x="212" y="266" class="pn">3</text><text x="274" y="266" class="pn">4</text><text x="336" y="266" class="pn">5</text><text x="398" y="266" class="pn">6</text><text x="460" y="266" class="pn">7</text><text x="522" y="266" class="pn">8</text><text x="88" y="328" class="pn">9</text><text x="150" y="328" class="pn">10</text><text x="212" y="328" class="pn">11</text><text x="274" y="328" class="pn">12</text><text x="336" y="328" class="pn">13</text><text x="398" y="328" class="pn">14</text><text x="460" y="328" class="pn">15</text><text x="522" y="328" class="pn">16</text><text x="88" y="390" class="pn">17</text><text x="150" y="390" class="pn">18</text><text x="212" y="390" class="pn">19</text><text x="274" y="390" class="pn">20</text><text x="336" y="390" class="pn">21</text><text x="398" y="390" class="pn">22</text><text x="460" y="390" class="pn">23</text><text x="522" y="390" class="pn">24</text><text x="88" y="452" class="pn">25</text><text x="150" y="452" class="pn">26</text><text x="212" y="452" class="pn">27</text><text x="274" y="452" class="pn">28</text><text x="336" y="452" class="pn">29</text><text x="398" y="452" class="pn">30</text><text x="460" y="452" class="pn">31</text><text x="522" y="452" class="pn">32</text><rect x="84" y="172" width="54" height="28" rx="4" fill="#c63ac6" stroke="#111"/><text x="111" y="189.5" class="bt" fill="#111">Synth 1</text><g class="g7"><circle cx="146" cy="96" r="21" fill="none" stroke="#00ffb5" stroke-width="4" stroke-opacity="0.44999999999999996"/><circle cx="194" cy="46" r="21" fill="none" stroke="#00ffb5" stroke-width="4" stroke-opacity="0.44999999999999996"/><circle cx="242" cy="96" r="21" fill="none" stroke="#00ffb5" stroke-width="4" stroke-opacity="0.44999999999999996"/><circle cx="290" cy="46" r="21" fill="none" stroke="#ffffff" stroke-width="4"/><circle cx="338" cy="96" r="21" fill="none" stroke="#00ffb5" stroke-width="4" stroke-opacity="0.44999999999999996"/><circle cx="386" cy="46" r="21" fill="none" stroke="#00ffb5" stroke-width="4" stroke-opacity="0.44999999999999996"/><circle cx="434" cy="96" r="21" fill="none" stroke="#00ffb5" stroke-width="4" stroke-opacity="0.44999999999999996"/><circle cx="482" cy="46" r="21" fill="none" stroke="#00ffb5" stroke-width="4" stroke-opacity="0.44999999999999996"/></g><text x="580" y="44" class="vw">Fuente del sinte</text><g class="g0"><circle cx="559" cy="443" r="9" class="fg"/></g><g class="g8"><path d="M265.8 32A28 28 0 0 1 314.2 32" class="ta"/><path d="M317.7 38.1L310.4 34.2L318.1 29.8z" fill="#ff6a13"/></g><g class="g9"><rect x="97" y="137" width="66" height="24" rx="6" class="fo"/><circle cx="160" cy="158" r="5" class="fg"/></g><rect x="12" y="474" width="632" height="102" rx="10" fill="#222428" stroke="#3a3d42"/><text x="24" y="495" class="ti">Editar los destinos de los macro knobs · desde RC2</text><g class="g1"><circle cx="40" cy="522" r="17" fill="#ff6a13"/><text x="40" y="526.5" class="sn">1/6</text><text x="68" y="518" class="cp">Con la vista de Synth 1 en pantalla, pulsa Synth 1 otra vez: la vista de la fuente.</text><text x="68" y="535" class="cp">El pad 32 (verde azulado) enciende el editor de destinos: los knobs ya no mueven los</text><text x="68" y="552" class="cp">macros. Solo Alpha 7.48: el editor está en el pad 26.</text></g><g class="g2"><circle cx="40" cy="522" r="17" fill="#ff6a13"/><text x="40" y="526.5" class="sn">2/6</text><text x="68" y="518" class="cp">Gira un knob (K4) para elegir su macro: su LED se pone blanco; el primer giro no</text><text x="68" y="535" class="cp">cambia nada. Los pads dibujan el número del campo actual: la ranura, 1-4, en</text><text x="68" y="552" class="cp">amarillo.</text></g><g class="g3"><circle cx="40" cy="522" r="17" fill="#ff6a13"/><text x="40" y="526.5" class="sn">3/6</text><text x="68" y="518" class="cp">El knob cambia el campo; Octave ▼ = el campo siguiente, Octave ▲ = el anterior:</text><text x="68" y="535" class="cp">ranura → inicio (verde) → fin (ámbar) → destino → profundidad. El inicio, aquí 0.</text></g><g class="g4"><circle cx="40" cy="522" r="17" fill="#ff6a13"/><text x="40" y="526.5" class="sn">4/6</text><text x="68" y="518" class="cp">Destino: su número de CC en blanco (74 = corte del filtro), o un NRPN en azul claro,</text><text x="68" y="535" class="cp">magenta o violeta (bancos 0, 1, 2). El knob recorre los 31 parámetros con CC por</text><text x="68" y="552" class="cp">número y luego los 39 que solo tienen NRPN.</text></g><g class="g5"><circle cx="40" cy="522" r="17" fill="#ff6a13"/><text x="40" y="526.5" class="sn">5/6</text><text x="68" y="518" class="cp">Profundidad: verde azulado = positiva, rojo = negativa (aquí +40). Los cambios</text><text x="68" y="535" class="cp">suenan al momento.</text></g><g class="g6"><circle cx="40" cy="522" r="17" fill="#ff6a13"/><text x="40" y="526.5" class="sn">6/6</text><text x="68" y="518" class="cp">Cualquier pad suelta el macro; el pad 32 apaga el editor. Para dejar los destinos en</text><text x="68" y="535" class="cp">el pack, guarda el patch (vista Preset: Clear + pad, dos veces).</text></g></svg>
